<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0a0a0a">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --surface: #1a1a1a;
    --surface-2: #222;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #999;
    --text-muted: #666;
    --accent: #f59e0b;
    --accent-dim: #92580a;
    --success: #10b981;
    --danger: #ef4444;
    --warn: #fbbf24;
    --shadow: 0 4px 24px rgba(0,0,0,0.6);
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: var(--safe-top);
    padding-bottom: calc(72px + var(--safe-bottom));
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(245,158,11,0.06), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---- Layout ---- */
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 24px;
    min-height: calc(100vh - 72px - var(--safe-bottom));
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 20px;
  }
  .header h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .header .date {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Cards ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-tight { padding: 14px; }
  .card-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 12px;
    font-weight: 600;
  }

  /* ---- Buttons ---- */
  .btn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #1a1100;
    font-family: inherit;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.06s ease, background 0.15s ease;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost {
    background: var(--surface-2);
    color: var(--text);
  }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: #001a0e; }
  .btn-sm { padding: 10px 14px; font-size: 14px; }
  .btn-xs { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* ---- Day picker ---- */
  .day-picker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .day-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px 4px;
    border-radius: 10px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
  }
  .day-pill.active {
    background: var(--accent);
    color: #1a1100;
    border-color: var(--accent);
  }
  .day-pill .recommended-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 4px;
    vertical-align: middle;
  }
  .day-pill.active .recommended-dot { background: #1a1100; }

  /* ---- Exercise list ---- */
  .ex-progress {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
  }
  .ex-progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.2s;
  }
  .ex-progress-bar.done { background: var(--success); }
  .ex-progress-bar.current { background: var(--accent); }

  .exercise {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border-strong);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  /* Rest-tier color coding: green = longest rest, yellow = mid, red = shortest */
  .exercise.tier-green {
    border-left-color: #16a34a;
    background: linear-gradient(100deg, rgba(22,163,74,0.07), transparent 42%), var(--surface);
  }
  .exercise.tier-yellow {
    border-left-color: #d99318;
    background: linear-gradient(100deg, rgba(217,147,24,0.07), transparent 42%), var(--surface);
  }
  .exercise.tier-red {
    border-left-color: #dc2626;
    background: linear-gradient(100deg, rgba(220,38,38,0.07), transparent 42%), var(--surface);
  }
  /* Current exercise: glow via box-shadow so it doesn't fight the tier left-border */
  .exercise.current {
    box-shadow: 0 0 0 1.5px var(--accent-dim) inset, 0 6px 22px rgba(0,0,0,0.5);
    border-top-color: var(--border-strong);
    border-right-color: var(--border-strong);
    border-bottom-color: var(--border-strong);
  }
  .exercise.done { opacity: 0.55; }
  /* Rest-time meta dot colors */
  .rest-meta.rest-green { color: #22c55e; }
  .rest-meta.rest-yellow { color: #e0a82e; }
  .rest-meta.rest-red { color: #ef4444; }
  /* Per-set "last time" reference line */
  .set-wrap { margin-bottom: 2px; }
  .set-last {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 1px 0 7px 44px;
    letter-spacing: 0.01em;
  }
  .set-last.set-tight { padding-bottom: 1px; }
  .set-last.set-best { color: #fbbf24; }
  /* Drop set (optional) */
  .drop-set {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
  }
  .drop-set-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .drop-set-label span { color: var(--accent); letter-spacing: 0.05em; }
  .drop-badge {
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .drop-row.logged .drop-badge { background: var(--success); color: #001a0e; }
  /* A finished exercise stays fully legible while still expanded (to add a drop set) */
  .exercise.done.open { opacity: 1; }
  /* Tier legend */
  .tier-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .tier-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .tier-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ex-header {
    padding: 16px;
    cursor: pointer;
    user-select: none;
  }
  .ex-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ex-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
  }
  .ex-idx {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .ex-meta {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .ex-meta-item { display: flex; align-items: center; gap: 4px; }
  .ex-suggest {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 8px;
    color: var(--accent);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ex-notes {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.4;
  }
  .ex-body {
    border-top: 1px solid var(--border);
    padding: 14px 16px 16px;
    display: none;
  }
  .exercise.open .ex-body { display: block; }
  .chev {
    color: var(--text-muted);
    font-size: 18px;
    transition: transform 0.15s;
  }
  .exercise.open .chev { transform: rotate(180deg); }

  /* ---- Set rows ---- */
  .sets-table {
    width: 100%;
  }
  .sets-head {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px 36px;
    gap: 8px;
    padding: 4px 2px 8px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .set-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 64px 36px;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
  }
  .set-num {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .set-row.logged .set-num {
    color: var(--success);
  }
  .set-input {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 10px 8px;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    -moz-appearance: textfield;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .rir-select {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    padding: 10px 4px;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  .log-btn {
    background: var(--accent);
    border: none;
    color: #1a1100;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    width: 36px;
    height: 40px;
    cursor: pointer;
  }
  .log-btn.logged {
    background: var(--success);
    color: #001a0e;
  }
  .ex-notes-input {
    width: 100%;
    margin-top: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border-radius: 8px;
    resize: vertical;
    min-height: 60px;
  }
  .ex-notes-input:focus { outline: none; border-color: var(--accent); }

  /* ---- Rest Timer ---- */
  .rest-bar {
    margin-top: 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .rest-bar .rest-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rest-bar .rest-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .rest-bar .rest-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }
  .rest-bar.active .rest-time { color: var(--accent); }
  .rest-bar.done .rest-time { color: var(--success); }
  .rest-bar .rest-actions { display: flex; gap: 6px; }

  /* ---- Bottom nav ---- */
  .nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: inherit;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon {
    width: 22px; height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ---- Lists / History ---- */
  .list-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .list-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .list-item-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
  }
  .list-item-title { font-weight: 600; font-size: 15px; }

  /* ---- Bodyweight ---- */
  .bw-input-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .bw-input {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    width: 100%;
  }
  .bw-input:focus { outline: none; border-color: var(--accent); }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    margin-top: 2px;
  }

  /* ---- Charts ---- */
  .chart-wrap {
    height: 220px;
    position: relative;
    margin-top: 6px;
  }
  .chart-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    background: var(--bg-elev);
    padding: 4px;
    border-radius: 10px;
  }
  .chart-tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .chart-tab.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* ---- Run logging ---- */
  .run-type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .run-type {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 14px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
  }
  .run-type.active {
    background: var(--accent);
    color: #1a1100;
    border-color: var(--accent);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .form-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
  }

  /* ---- Misc ---- */
  .toast {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 10px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }
  .empty-icon {
    font-size: 32px;
    opacity: 0.4;
    margin-bottom: 8px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }
  .small { font-size: 12px; color: var(--text-muted); }
  .danger-text { color: var(--danger); }
  .accent-text { color: var(--accent); }
  .success-text { color: var(--success); }

  /* Welcome screen */
  .welcome {
    text-align: center;
    padding: 60px 20px 20px;
  }
  .welcome h2 {
    font-size: 22px;
    margin: 0 0 8px;
    font-weight: 700;
  }
  .welcome p {
    color: var(--text-dim);
    margin: 0 0 24px;
  }

  /* Workout summary modal */
  .summary-stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .summary-stat:last-child { border-bottom: none; }
  .summary-stat .label { color: var(--text-dim); font-size: 14px; }
  .summary-stat .value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; }

  /* PR badge */
  .pr-badge {
    display: inline-block;
    background: var(--accent);
    color: #1a1100;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Detail view */
  .detail-back {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    padding: 0 0 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ---- V2: Exercise icon ---- */
  .ex-name-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .ex-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    padding: 4px;
  }
  .ex-icon svg { width: 100%; height: 100%; }
  .exercise.done .ex-icon { color: var(--text-muted); }

  /* ---- V2: YouTube demo link ---- */
  .demo-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.04em;
    border-bottom: 1px dashed var(--border-strong);
    padding-bottom: 1px;
    width: fit-content;
  }
  .demo-link:active { color: var(--accent); }

  /* ---- V2: Stretching checklist ---- */
  .stretches-list { display: flex; flex-direction: column; gap: 2px; }
  .stretch-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .stretch-item input { display: none; }
  .stretch-check {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg-elev);
    position: relative;
    transition: all 0.15s;
  }
  .stretch-item.checked .stretch-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .stretch-item.checked .stretch-check::after {
    content: "✓";
    position: absolute;
    inset: 0;
    color: #1a1100;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stretch-label {
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
  }
  .stretch-item.checked .stretch-label {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
  }

  /* ---- V2: Add-ons textarea ---- */
  .addons-box {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    resize: vertical;
    min-height: 70px;
    line-height: 1.4;
  }
  .addons-box:focus { outline: none; border-color: var(--accent); }

  /* ---- V2: Run recommendation card ---- */
  .run-rec-card {
    background:
      linear-gradient(135deg, rgba(245,158,11,0.08), transparent 60%),
      var(--surface);
    border-color: rgba(245,158,11,0.3);
  }
  .run-rec-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .run-rec-details {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .run-rec-pace {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }
  .run-alt-select {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid rgba(245,158,11,0.4);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    margin-bottom: 10px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2012%208'%3E%3Cpath%20fill='%23f59e0b'%20d='M1%201l5%205%205-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 12px;
  }
  .run-rec-hint {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  /* Plyos & drills collapsible box */
  .plyo-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .plyo-box > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .plyo-box > summary::-webkit-details-marker { display: none; }
  .plyo-chev { color: var(--text-muted); transition: transform 0.2s; }
  .plyo-box[open] .plyo-chev { transform: rotate(180deg); }
  .plyo-list { padding: 4px 8px 8px; }
  .plyo-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 8px;
    border-top: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .plyo-item:active { background: var(--bg-elev); }
  .plyo-yt { font-size: 11px; color: var(--accent); font-weight: 600; }
  /* Collapsed-by-default history sections */
  .hist-collapse > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 2px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .hist-collapse > summary::-webkit-details-marker { display: none; }
  .hist-chev { transition: transform 0.2s; }
  .hist-collapse[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .hist-collapse[open] .hist-chev { transform: rotate(180deg); }
  .run-rec-vo2 {
    margin-top: 14px;
    padding: 12px;
    background: var(--bg-elev);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }
  .vo2-week-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .vo2-week-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .vo2-week-details {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ---- V2: Readiness badge ---- */
  .readiness-badge {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .readiness-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 12px currentColor;
  }
  .readiness-text { flex: 1; min-width: 0; }
  .readiness-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .readiness-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.3;
  }

  /* ---- V2: Hydration buttons ---- */
  .hydration-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .hydration-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 14px 8px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .hydration-btn.active.low {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
  }
  .hydration-btn.active.medium {
    background: var(--warn);
    border-color: var(--warn);
    color: #2a1a00;
  }
  .hydration-btn.active.high {
    background: var(--success);
    border-color: var(--success);
    color: #001a0e;
  }

  /* ---- V2: Past check-in entries ---- */
  .past-checkin {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .past-checkin:last-child { border-bottom: none; }
  .checkin-metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .checkin-metrics span { display: inline-flex; align-items: center; }
  .hyd-tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .hyd-low { background: var(--danger); color: white; }
  .hyd-medium { background: var(--warn); color: #2a1a00; }
  .hyd-high { background: var(--success); color: #001a0e; }

  /* ---- V2: Nav adjustments for 6 tabs ---- */
  .nav-label {
    font-size: 9px;
    letter-spacing: 0.06em;
  }
  @media (min-width: 380px) {
    .nav-label { font-size: 10px; letter-spacing: 0.08em; }
  }
  /* ---- History ranking cards (2×3 grid, color-tiered by percentile) ---- */
  .rank-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
    margin-bottom: 18px;
  }
  .rank-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 9px;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .rank-card .rank-name {
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.92;
    line-height: 1.15;
  }
  .rank-card .rank-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
    margin: 6px 0 5px;
  }
  .rank-card .rank-value span { font-size: 10px; font-weight: 600; opacity: 0.8; }
  .rank-card .rank-pct { font-size: 11px; font-weight: 700; }
  .rank-card .rank-pct span {
    display: block;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    opacity: 0.85;
    margin-top: 1px;
  }
  .rank-card.gray { background: var(--surface); color: var(--text-muted); }
  .rank-card.gray .rank-value { color: var(--text-dim); }
  .rank-card.green  { background: linear-gradient(135deg, #059669, #34d399); color: #052e1f; border-color: transparent; box-shadow: 0 6px 20px rgba(16,185,129,0.35); }
  .rank-card.blue   { background: linear-gradient(135deg, #2563eb, #60a5fa); color: #fff; border-color: transparent; box-shadow: 0 6px 20px rgba(59,130,246,0.38); }
  .rank-card.red    { background: linear-gradient(135deg, #dc2626, #fb7185); color: #fff; border-color: transparent; box-shadow: 0 6px 20px rgba(239,68,68,0.38); }
  .rank-card.purple { background: linear-gradient(135deg, #7c3aed, #c084fc); color: #fff; border-color: transparent; box-shadow: 0 6px 22px rgba(168,85,247,0.45); }
  .rank-card.gold   { background: linear-gradient(135deg, #d97706, #fcd34d); color: #1a1100; border-color: transparent; box-shadow: 0 6px 24px rgba(245,158,11,0.55); }
  .rank-card.gold::after {
    content: "★";
    position: absolute;
    top: 8px; right: 12px;
    font-size: 16px;
    opacity: 0.55;
  }

  /* ---- Variants, swaps, effort card, phase selector ---- */
  .variant-row { margin: 8px 0 2px; }
  .variant-select {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2012%208'%3E%3Cpath%20fill='%23888'%20d='M1%201l5%205%205-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 10px;
  }
  .sub-chip {
    display: inline-block;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #1a1100;
    background: var(--accent);
    border-radius: 5px;
    padding: 2px 6px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .swap-toggle {
    display: block;
    width: 100%;
    background: none;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    padding: 9px;
    margin-top: 12px;
    cursor: pointer;
  }
  .swap-row { margin-top: 8px; }
  .swap-active {
    margin-top: 12px;
    font-size: 12px;
    color: var(--accent);
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 10px;
    padding: 9px 12px;
  }
  .swap-clear-link {
    background: none; border: none; color: var(--accent);
    text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0;
  }
  .effort-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .effort-row:last-of-type { border-bottom: none; }
  .effort-name { font-weight: 600; font-size: 14px; }
  .effort-stats { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
  .rir-chip {
    font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 8px;
    background: var(--bg-elev); color: var(--text-muted);
  }
  .rir-chip.rir-good { background: rgba(52,211,153,0.15); color: #34d399; }
  .rir-chip.rir-mid  { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .rir-chip.rir-low  { background: rgba(248,113,113,0.15); color: #f87171; }
  .trend { font-size: 12px; font-weight: 700; }
  .trend-up { color: #34d399; }
  .trend-flat { color: var(--text-muted); }
  .trend-down { color: #f87171; }
  .effort-flag {
    margin-top: 6px; font-size: 11.5px; font-weight: 600; color: #f87171;
    background: rgba(248,113,113,0.08); border-radius: 8px; padding: 6px 10px;
  }
  .effort-flag.effort-ok { color: #34d399; background: rgba(52,211,153,0.08); }
  .phase-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .phase-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
    padding: 11px 4px;
    cursor: pointer;
  }
  .phase-btn.active {
    background: rgba(245,158,11,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pdf-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---- Rest clock band (counts up from the last logged set) ---- */
  .rest-band {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 0 12px;
    padding: 9px 14px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid transparent;
    transition: background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .rest-band .rb-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    opacity: 0.85;
  }
  .rest-band .rb-elapsed {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .rest-band .rb-target { font-size: 10.5px; font-weight: 600; opacity: 0.8; }
  .rest-band.rb-idle   { background: var(--bg-elev); border-color: var(--border); color: var(--text-muted); }
  .rest-band.rb-red    { background: rgba(239,68,68,0.16);  border-color: rgba(239,68,68,0.5);  color: #fca5a5; }
  .rest-band.rb-yellow { background: rgba(245,158,11,0.16); border-color: rgba(245,158,11,0.5); color: #fcd34d; }
  .rest-band.rb-green  { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.55); color: #6ee7b7; }

  /* ---- Collapsible Core / Stretching sections ---- */
  .sect-collapse > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .sect-collapse > summary::-webkit-details-marker { display: none; }
  .sect-chev { color: var(--text-muted); font-size: 13px; transition: transform .2s; }
  .sect-collapse[open] .sect-chev { transform: rotate(180deg); }

  /* ---- All-time total volume banner ---- */
  .vol-banner {
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .vol-banner .vol-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.9;
  }
  .vol-banner .vol-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(30px, 9vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    margin: 6px 0 4px;
    letter-spacing: -0.02em;
  }
  .vol-banner .vol-number span { font-size: 15px; font-weight: 600; opacity: 0.8; }
  .vol-banner .vol-sub { font-size: 12px; font-weight: 600; letter-spacing: 0.03em; opacity: 0.9; }
  .vol-banner.gray { background: var(--surface); color: var(--text-dim); }
  .vol-banner.green  { background: linear-gradient(135deg, #059669, #34d399); color: #052e1f; border-color: transparent; box-shadow: 0 8px 26px rgba(16,185,129,0.4); }
  .vol-banner.blue   { background: linear-gradient(135deg, #2563eb, #60a5fa); color: #fff; border-color: transparent; box-shadow: 0 8px 26px rgba(59,130,246,0.42); }
  .vol-banner.red    { background: linear-gradient(135deg, #dc2626, #fb7185); color: #fff; border-color: transparent; box-shadow: 0 8px 26px rgba(239,68,68,0.42); }
  .vol-banner.purple { background: linear-gradient(135deg, #7c3aed, #c084fc); color: #fff; border-color: transparent; box-shadow: 0 8px 28px rgba(168,85,247,0.5); }
  .vol-banner.gold   { background: linear-gradient(135deg, #d97706, #fcd34d); color: #1a1100; border-color: transparent; box-shadow: 0 8px 30px rgba(245,158,11,0.6); }
  .vol-banner.gold::after {
    content: "★";
    position: absolute;
    top: 14px; right: 18px;
    font-size: 22px;
    opacity: 0.5;
  }

  /* ======================================================================
     HEADER ⋮ + SHEETS (Settings & Data panel, Nutrition sheet)
     ====================================================================== */
  .header-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .kebab, .sheet-close {
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    font-size: 15px; font-family: inherit;
    transition: color .15s ease, border-color .15s ease, transform .06s ease;
  }
  .kebab svg { width: 18px; height: 18px; fill: currentColor; }
  .kebab:active, .sheet-close:active { transform: scale(0.94); }
  @media (hover: hover) {
    .kebab:hover, .sheet-close:hover { color: var(--text); border-color: var(--border-strong); }
  }
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 150;
    display: none; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,0.62);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .sheet-overlay.show { display: flex; animation: sheetFade .18s ease; }
  .sheet {
    width: 100%; max-width: 560px;
    max-height: calc(100% - var(--safe-top) - 14px);
    display: flex; flex-direction: column;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong); border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding-bottom: var(--safe-bottom);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    animation: sheetUp .22s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.tall { height: calc(100% - var(--safe-top) - 14px); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text); }
  .sheet-head .small { margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 18px 24px;
  }
  body.sheet-open { overflow: hidden; }
  @keyframes sheetUp { from { transform: translateY(36px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes sheetFade { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,0.62); } }
  @media (min-width: 700px) {
    .sheet-overlay { align-items: center; padding: 24px; }
    .sheet {
      border-radius: 18px; border-bottom: 1px solid var(--border-strong);
      max-height: 86vh; padding-bottom: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .sheet.tall { height: 86vh; }
  }

  /* ======================================================================
     NUTRITION
     ====================================================================== */
  .nut-datebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 16px; }
  .nut-dnav {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-elev); color: var(--text);
    font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .nut-dnav:disabled { opacity: .25; cursor: default; }
  .nut-dlabel {
    flex: 1; min-width: 0; background: none; border: none; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; font-family: inherit; padding: 2px 0;
  }
  .nut-dlabel:disabled { cursor: default; }

// Parse "YYYY-MM-DD" as a LOCAL date. new Date("2026-06-09") is interpreted as
// UTC midnight, which displays as June 8 in US time zones — that was the
// check-in date glitch. Full ISO timestamps still parse normally.
function parseLocalDate(d) {
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [y, m, day] = d.split("-").map(Number);
    return new Date(y, m - 1, day);
  }
  return new Date(d);
}
function fmtDate(d) {
  return parseLocalDate(d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtDateLong(d) {
  return parseLocalDate(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function fmtTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
function localIsoDate(input) {
  // LOCAL calendar date for any date/timestamp, not UTC. toISOString() flips
  // to tomorrow after ~7 PM in Green Bay, which stamped evening check-ins
  // (and CSV-exported evening workouts) with the next day's date.
  const d = input ? new Date(input) : new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayIsoDate() {
  return localIsoDate();
}
// Escape user-typed text before injecting into HTML (notes, reflections).
function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtMMSS(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}
function est1RM(weight, reps) {
  // Epley formula
  if (!weight || !reps) return 0;
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ============================================================================
// STRENGTH PERCENTILES — vs ALL GYM-GOERS
// Static snapshot of StrengthLevel one-rep-max standards (overall adult male
// and female, lb — these "overall" rows already average across bodyweights).
// Anchors are 1RM at Beginner/Novice/Intermediate/Advanced/Elite = stronger
// than 5/20/50/80/95% of lifters who log that lift. Pulled June 2026.
//
// The comparison population is modeled as "everyone at the gym":
//   - GYM_POP.femaleShare : fraction of gym-goers who are women
//   - GYM_POP.casualShare : fraction (within each sex) who don't seriously
//       train barbell lifts — modeled as ~30% weaker at the same percentile
// Tweak these constants to make the scale harder or easier.
// ============================================================================
const GYM_POP = { femaleShare: 0.5, casualShare: 0.5, casualFactor: 1.45 };

const STRENGTH_STD = {
  bench:    { label: "Bench Press",    male: [103, 154, 217, 291, 372], female: [38, 69, 111, 164, 223] },
  squat:    { label: "Squat",          male: [141, 206, 287, 381, 483], female: [65, 107, 161, 227, 300] },
  deadlift: { label: "Deadlift",       male: [173, 246, 336, 440, 552], female: [84, 132, 193, 265, 345] },
  shoulder: { label: "Shoulder Press", male: [66, 99, 142, 192, 248],   female: [28, 48, 75, 107, 143] },
  row:      { label: "Bent-Over Row",  male: [89, 133, 188, 253, 323],  female: [34, 58, 91, 130, 175] },
  curl:     { label: "Barbell Curl",   male: [38, 66, 103, 149, 201],   female: [14, 31, 54, 85, 120] },
  latpull:  { label: "Lat Pulldown",   male: [85, 127, 180, 243, 312],  female: [43, 68, 101, 137, 176] },
  triceps:  { label: "Tricep Extension", male: [11, 27, 52, 84, 122],   female: [7, 15, 28, 46, 68] },
  calf:     { label: "Calf Raise",      male: [69, 160, 295, 471, 678], female: [33, 93, 182, 298, 440] }
};

// Map app exercises to a standard. `factor` scales the logged load to a
// barbell-equivalent before estimating 1RM. Jasper logs the TOTAL weight moved
// (both dumbbells summed on two-arm lifts, e.g. 230 = two 115s; single-arm
// lifts logged per arm), so the entered number is already the comparison load
// and factor stays 1 everywhere. `factor` kept in case a per-hand lift is added.
const STD_MAP = {
  "DB Bench Press":           { std: "bench",    factor: 1 },
  "Smith Bench Press (flat)": { std: "bench",    factor: 1 },
  "Seated DB Shoulder Press": { std: "shoulder", factor: 1 },
  "Back Squat":               { std: "squat",    factor: 1 },
  "Hex Bar Deadlift":         { std: "deadlift", factor: 1 },
  "Bent Barbell Row":         { std: "row",      factor: 1 },
  "Barbell or DB Curl":       { std: "curl",     factor: 1 },
  "Lat Pulldown (neutral, narrow)": { std: "latpull", factor: 1 },
  "Weighted Pull-Up / Lat Pulldown": { std: "latpull", factor: 1 },
  "Overhead DB Tricep Extension": { std: "triceps", factor: 1 },
  "Standing Calf Raise":      { std: "calf",     factor: 1 }
};

function formatTopPct(tp) {
  if (tp >= 1) return "Top " + Math.round(tp) + "%";
  if (tp >= 0.2) return "Top " + tp.toFixed(1) + "%";
  return "Top 0.1%";
}

// "Stronger than" % within one anchor set, with extrapolation past Elite.
function cdfFromAnchors(x, pts) {
  const [beg, nov, int_, adv, elite] = pts;
  const a = [
    { st: 1,    w: beg * 0.55 },
    { st: 5,    w: beg },
    { st: 20,   w: nov },
    { st: 50,   w: int_ },
    { st: 80,   w: adv },
    { st: 95,   w: elite },
    { st: 99,   w: elite + (elite - adv) * 1.1 },
    { st: 99.9, w: elite + (elite - adv) * 2.4 }
  ];
  if (x <= a[0].w) return Math.max(0.2, a[0].st * (x / a[0].w));
  if (x >= a[a.length - 1].w) return 99.95;
  for (let i = 0; i < a.length - 1; i++) {
    if (x >= a[i].w && x <= a[i + 1].w) {
      const f = (x - a[i].w) / (a[i + 1].w - a[i].w);
      return a[i].st + f * (a[i + 1].st - a[i].st);
    }
  }
  return 50;
}

function strengthPercentile(e1rm, stdKey) {
  const std = STRENGTH_STD[stdKey];
  if (!std || !e1rm) return null;
  // Within each sex: blend dedicated lifters with casuals (who lift ~30% less
  // at the same percentile — modeled by evaluating the lifter curve at x×1.45).
  const sexMix = (pts) =>
    (1 - GYM_POP.casualShare) * cdfFromAnchors(e1rm, pts) +
    GYM_POP.casualShare * cdfFromAnchors(e1rm * GYM_POP.casualFactor, pts);
  const strongerThan =
    (1 - GYM_POP.femaleShare) * sexMix(std.male) +
    GYM_POP.femaleShare * sexMix(std.female);
  const topPct = Math.min(99, Math.max(0.1, 100 - strongerThan));
  return { topPct, label: formatTopPct(topPct) };
}

// For a completed workout, return percentile info for each mapped lift performed.
function workoutPercentiles(w) {
  const out = [];
  const seen = new Set();
  w.exercises.forEach(ex => {
    const map = STD_MAP[effectiveName(ex)];
    if (!map || seen.has(effectiveName(ex))) return;
    const logged = ex.sets.filter(s => s.logged);
    if (!logged.length) return;
    let bestE1 = 0;
    logged.forEach(s => {
      const e1 = est1RM(s.weight * map.factor, s.reps);
      if (e1 > bestE1) bestE1 = e1;
    });
    const pc = strengthPercentile(bestE1, map.std);
    if (!pc) return;
    seen.add(effectiveName(ex));
    out.push({ name: effectiveName(ex), stdLabel: STRENGTH_STD[map.std].label, e1: bestE1, ...pc });
  });
  return out;
}

// ============================================================================
// VO2 MAX PERCENTILE — vs all men & women (Cooper Institute, ages 20–29)
// Percentile → VO2 (ml/kg/min). Blended 50/50 male/female. Static, June 2026.
// ============================================================================
const VO2_NORMS = {
  male:   [[5, 29.0], [10, 32.1], [25, 40.1], [50, 48.0], [75, 55.2], [90, 61.8], [95, 66.3]],
  female: [[5, 21.7], [10, 23.9], [25, 30.5], [50, 37.6], [75, 44.7], [90, 51.3], [95, 56.0]]
};

function vo2StrongerThan(vo2, anchors) {
  const n = anchors.length;
  // extend below 5th and above 95th for extrapolation
  const pts = [[1, anchors[0][1] * 0.7], ...anchors,
    [99, anchors[n - 1][1] + (anchors[n - 1][1] - anchors[n - 2][1]) * 1.5],
    [99.9, anchors[n - 1][1] + (anchors[n - 1][1] - anchors[n - 2][1]) * 3.2]];
  if (vo2 <= pts[0][1]) return Math.max(0.3, pts[0][0] * (vo2 / pts[0][1]));
  if (vo2 >= pts[pts.length - 1][1]) return 99.9;
  for (let i = 0; i < pts.length - 1; i++) {
    if (vo2 >= pts[i][1] && vo2 <= pts[i + 1][1]) {
      const f = (vo2 - pts[i][1]) / (pts[i + 1][1] - pts[i][1]);
      return pts[i][0] + f * (pts[i + 1][0] - pts[i][0]);
    }
  }
  return 50;
}

function vo2Percentile(vo2) {
  if (!vo2) return null;
  const st = 0.5 * vo2StrongerThan(vo2, VO2_NORMS.male) + 0.5 * vo2StrongerThan(vo2, VO2_NORMS.female);
  const topPct = Math.min(99, Math.max(0.1, 100 - st));
  return { topPct, label: formatTopPct(topPct) };
}

// Best all-time estimated 1RM across any of the given exercise names.
function bestE1ForNames(names) {
  let best = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      if (!names.includes(effectiveName(ex))) return;
      ex.sets.filter(s => s.logged).forEach(s => {
        const e = est1RM(s.weight, s.reps);
        if (e > best) best = e;
      });
    });
  });
  return best;
}

// Most recent logged VO2 max (from daily check-ins).
function currentVo2() {
  const v = state.dailyCheckins.filter(c => c.vo2 != null).sort((a, b) => a.date.localeCompare(b.date));
  return v.length ? v[v.length - 1].vo2 : null;
}

// Color tier by "top %". Lower = better. Vibrant gradients defined in CSS.
function rankTierClass(topPct) {
  if (topPct == null) return "gray";
  if (topPct <= 2)  return "gold";
  if (topPct <= 10) return "purple";
  if (topPct <= 20) return "red";
  if (topPct <= 30) return "blue";
  if (topPct <= 40) return "green";
  return "gray";
}

// Build the 6 history ranking cards.
function rankCardsData() {
  const lift = (label, names, std) => {
    const e1 = bestE1ForNames(names);
    const pc = e1 ? strengthPercentile(e1, std) : null;
    return { name: label, value: e1 ? String(e1) : null, unit: "lb",
             topPct: pc ? pc.topPct : null, pctLabel: pc ? pc.label : null, pop: "gym-goers" };
  };
  const v = currentVo2();
  const vpc = v ? vo2Percentile(v) : null;
  return [
    lift("Bench", ["DB Bench Press", "Smith Bench Press (flat)"], "bench"),
    lift("Squat", ["Back Squat"], "squat"),
    lift("Deadlift", ["Hex Bar Deadlift"], "deadlift"),
    lift("Lat Pull", ["Lat Pulldown (neutral, narrow)", "Weighted Pull-Up / Lat Pulldown"], "latpull"),
    lift("Shoulder Press", ["Seated DB Shoulder Press"], "shoulder"),
    lift("Triceps", ["Overhead DB Tricep Extension"], "triceps"),
    lift("Biceps", ["Barbell or DB Curl"], "curl"),
    lift("Calves", ["Standing Calf Raise"], "calf"),
    { name: "VO₂ Max", value: v ? String(v) : null, unit: "ml/kg",
      topPct: vpc ? vpc.topPct : null, pctLabel: vpc ? vpc.label : null, pop: "all men & women" }
  ];
}

// ============================================================================
// TRAINING EFFORT CHECK — per-compound avg RIR + progress over recent sessions.
// Flags "grinding without progress" (3+ sessions at ~failure, no e1RM gain).
// Phase-aware: during a cut, holding steady is on-track, not a stall.
// ============================================================================
function compoundNames() {
  const out = [];
  for (const k in PLAN) PLAN[k].exercises.forEach(d => {
    if (d.isCompound && !d.optional && !out.includes(d.name)) out.push(d.name);
  });
  return out;
}

function effortCheckData() {
  return compoundNames().map(name => {
    const sess = [];
    for (let i = state.workouts.length - 1; i >= 0 && sess.length < 4; i--) {
      const ex = state.workouts[i].exercises.find(e => effectiveName(e) === name);
      if (!ex) continue;
      const sets = ex.sets.filter(s => s.logged && s.weight && s.reps);
      if (!sets.length) continue;
      const rirs = sets.filter(s => s.rir != null).map(s => s.rir);
      sess.unshift({
        avgRir: rirs.length ? rirs.reduce((a, b) => a + b, 0) / rirs.length : null,
        bestE1: Math.max(...sets.map(s => est1RM(s.weight, s.reps)))
      });
    }
    if (sess.length < 2) return null;
    const rirVals = sess.filter(s => s.avgRir != null).map(s => s.avgRir);
    const avgRir = rirVals.length ? rirVals.reduce((a, b) => a + b, 0) / rirVals.length : null;
    const first = sess[0].bestE1, latest = sess[sess.length - 1].bestE1;
    const delta = first ? (latest - first) / first * 100 : 0;
    const grinding = sess.length >= 3 && rirVals.length >= 3 &&
      rirVals.slice(-3).every(r => r <= 0.7) && delta <= 1;
    return { name, avgRir, delta, grinding, n: sess.length };
  }).filter(Boolean);
}

function renderEffortCard() {
  const rows = effortCheckData();
  if (!rows.length) return "";
  const cutting = state.phase === "cutting";
  return `
    <div class="card">
      <div class="card-title">Training Effort <span style="color: var(--text-dim); letter-spacing: 0; text-transform: none; font-weight: 500;">· avg RIR & e1RM trend</span></div>
      ${rows.map(r => {
        const rirCls = r.avgRir == null ? '' : (r.avgRir >= 1.5 ? 'rir-good' : (r.avgRir >= 0.8 ? 'rir-mid' : 'rir-low'));
        const arrow = r.delta > 1 ? '↑' : (r.delta < -1 ? '↓' : '→');
        const arrowCls = r.delta > 1 ? 'trend-up' : (r.delta < -1 ? 'trend-down' : 'trend-flat');
        let flag = '';
        if (r.grinding) {
          flag = cutting && r.delta > -3
            ? `<div class="effort-flag effort-ok">≈ Holding through the cut — on track</div>`
            : `<div class="effort-flag">⚠ 3+ sessions near failure without progress — try RIR 1–2 and rebuild</div>`;
        }
        return `
        <div class="effort-row">
          <div class="effort-name">${r.name}</div>
          <div class="effort-stats mono">
            <span class="rir-chip ${rirCls}">${r.avgRir != null ? 'RIR ' + r.avgRir.toFixed(1) : '—'}</span>
            <span class="trend ${arrowCls}">${arrow} ${r.delta >= 0 ? '+' : ''}${r.delta.toFixed(1)}%</span>
          </div>
          ${flag}
        </div>`;
      }).join("")}
      <div class="small" style="margin-top: 8px; color: var(--text-dim);">Trend = best e1RM now vs ~4 sessions ago${cutting ? ' · cut mode: holding steady counts as winning' : ''}.</div>
    </div>
  `;
}

function renderRankGrid() {
  const cards = rankCardsData();
  return `
    <div class="rank-grid">
      ${cards.map(c => {
        const cls = rankTierClass(c.topPct);

          <div class="rank-pct">${hasData && c.pctLabel ? `${c.pctLabel} <span>${c.pop}</span>` : 'No data yet'}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}
// ============================================================================
// ALL-TIME TOTAL VOLUME BANNER
// Sum of weight × reps for every logged set (including logged drop sets).
// Color tier by milestone. Static thresholds — easy to edit.
// ============================================================================
function totalVolumeAllTime() {
  let total = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.filter(s => s.logged).forEach(s => { total += (s.weight || 0) * (s.reps || 0); });
      const d = ex.dropSet;
      if (d && d.logged && d.weight && d.reps) total += d.weight * d.reps;
    });
  });
  return total;
}

function volumeTierClass(v) {
  if (v >= 5000000) return "gold";
  if (v >= 1000000) return "purple";
  if (v >= 500000)  return "blue";
  if (v >= 100000)  return "red";
  if (v >= 50000)   return "green";
  return "gray";
}

function nextVolumeMilestone(v) {
  const ms = [[50000, "Green"], [100000, "Red"], [500000, "Blue"], [1000000, "Purple"], [5000000, "Gold"]];
  for (const [t, name] of ms) if (v < t) return { remaining: t - v, name };
  return null;
}

function renderVolumeBanner() {
  const v = totalVolumeAllTime();
  const cls = volumeTierClass(v);
  const next = nextVolumeMilestone(v);
  const sub = next
    ? `${next.remaining.toLocaleString()} lb to ${next.name}`
    : "Top tier reached — Gold ★";
  return `
    <div class="vol-banner ${cls}">
      <div class="vol-label">Total Weight Lifted · All Time</div>
      <div class="vol-number">${v.toLocaleString()} <span>lb</span></div>
      <div class="vol-sub">${sub}</div>
    </div>
  `;
}

// ============================================================================
// EXERCISE VARIANTS & SUBSTITUTIONS
// Ambiguous lifts get an implement/equipment selector; each variant keeps its
// own Last/Best/progression history. Legacy sets (no variant) live in the
// first-listed (default) variant's bucket.
// ============================================================================
const VARIANTS = {
  "Barbell or DB Curl": ["Barbell", "Dumbbells (total)", "Cable"],
  "Hammer Curl": ["Per DB", "Total (both DBs)"],
  "Cable Chest Fly": ["Cable (per side)", "Machine / total stack"],
  "Cable Y-Raise / Reverse Pec Deck": ["Cable Y-Raise", "Reverse Pec Deck"],
  "Overhead Cable Tricep Ext (rope)": ["Rope", "Bar"],
  "Preacher Curl": ["Free-weight (EZ/DB)", "Machine", "Cable"],
  "Seated Calf Raise": ["Plate-loaded", "Machine stack"],
  "Weighted Pull-Up / Lat Pulldown": ["Lat Pulldown", "Weighted Pull-Up"],
  "Single-Arm Cable Row (shotgun)": ["Cable", "Machine row"],
  "Seated Cable Row (close grip)": ["Cable", "Chest-Supported Row"],
  "Romanian Deadlift": ["Barbell", "Dumbbells"],
  "Rear Delt Cable Fly": ["Cable", "Machine"]
};

// The movement actually performed (substitution wins over the plan name).
function effectiveName(ex) { return ex.subTo || ex.name; }

// Does a historical exercise entry belong to the requested variant bucket?
function variantMatches(histEx, variant, name) {
  const opts = VARIANTS[name];
  if (!opts) return true;
  const hv = histEx.variant || opts[0];
  return hv === (variant || opts[0]);
}

// Most recent variant used for an exercise (so new sessions default to it).
function lastVariantFor(name) {
  const opts = VARIANTS[name];
  if (!opts) return null;
  for (let i = state.workouts.length - 1; i >= 0; i--) {
    const ex = state.workouts[i].exercises.find(e => e.name === name && e.variant);
    if (ex) return ex.variant;
  }
  return opts[0];
}

function findLastForExercise(dayKey, exerciseName, variant) {
  for (let i = state.workouts.length - 1; i >= 0; i--) {
    const w = state.workouts[i];
    if (w.dayKey !== dayKey) continue;
    const ex = w.exercises.find(e => effectiveName(e) === exerciseName && variantMatches(e, variant, exerciseName));
    if (ex && ex.sets.some(s => s.logged)) return { workout: w, exercise: ex };
  }
  return null;
}

// Best logged set at a specific set position (index) for an exercise, by estimated
// 1RM, across every day it appears plus the in-progress workout. So set 1's "Best"
// reflects best-ever first sets, set 2's reflects best-ever second sets, etc.
function bestSetAtPosition(name, pos, variant) {
  let best = null, bestE1 = 0;
  const scan = (w) => {
    if (!w || !w.exercises) return;
    w.exercises.forEach(exr => {
      if (effectiveName(exr) !== name || !variantMatches(exr, variant, name)) return;
      const s = exr.sets[pos];
      if (!s || !s.logged || s.weight == null || s.reps == null) return;
      const e1 = est1RM(s.weight, s.reps);
      if (e1 > bestE1) { bestE1 = e1; best = s; }
    });
  };
  state.workouts.forEach(scan);
  scan(state.current);
  return best;
}

function suggestNext(dayKey, exDef, variant) {
  const last = findLastForExercise(dayKey, exDef.name, variant);
  if (!last) return null;

  const loggedSets = last.exercise.sets.filter(s => s.logged && s.weight != null);
  if (loggedSets.length === 0) return null;

  const topSet = loggedSets[0]; // first set is heaviest typically
  // Did ALL working sets hit top of rep range?
  const allHitTop = loggedSets.length >= exDef.sets &&
    loggedSets.every(s => s.reps >= exDef.repsHigh);

  const increment = exDef.isCompound ? 5 : 2.5;

  if (allHitTop) {
    return {
      weight: topSet.weight + increment,
      reps: exDef.repsLow,
      reason: `Hit top of range last time. +${increment} lb, drop to ${exDef.repsLow} reps.`,
      lastDate: last.workout.date
    };
  } else {
    return {
      weight: topSet.weight,
      reps: Math.min(topSet.reps + 1, exDef.repsHigh),
      reason: `Last time: ${topSet.weight} lb × ${topSet.reps}. Try +1 rep.`,
      lastDate: last.workout.date
    };
  }
}

// Recent logged weights (last n sessions) for an exercise instance, matched on
// the movement actually performed + its variant. Used by the unit-sanity guard.
function recentWeightsFor(ex, n) {
  const name = effectiveName(ex);
  const out = [];
  let sessions = 0;
  for (let i = state.workouts.length - 1; i >= 0 && sessions < (n || 3); i--) {
    const hx = state.workouts[i].exercises.find(e => effectiveName(e) === name && variantMatches(e, ex.variant, ex.name));
    if (!hx) continue;
    const ws = hx.sets.filter(s => s.logged && s.weight).map(s => s.weight);
    if (!ws.length) continue;
    out.push(...ws);
    sessions++;
  }
  return out;
}

// Local-time Monday (YYYY-MM-DD) of the week containing d — run-week bucketing.
function mondayIso(d) {
  const dt = d ? new Date(d) : new Date();
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  const p = n => String(n).padStart(2, "0");
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}

// ============================================================================
// WORKOUT FLOW
// ============================================================================
let justCompletedExIdx = null; // keeps a just-finished exercise expanded (for optional drop set)

function startWorkout(dayKey) {
  const day = PLAN[dayKey];
  if (!day) return;

  let exercises = day.exercises.map(def => ({
    name: def.name,
    def: def,
    sets: Array.from({ length: def.sets }, (_, i) => ({
      idx: i + 1,
      weight: null,
      reps: null,
      rir: null,
      logged: false,
      timestamp: null
    })),
    dropSet: { weight: null, reps: null, rir: null, logged: false },
    variant: lastVariantFor(def.name),
    subTo: null,
    notes: ""
  }));

  state.current = {
    dayKey,
    dayName: day.name,
    date: new Date().toISOString(),
    exercises,
    stretches: {},       // { stretchName: true } for checked items
    core: {},            // { coreName: true } for checked items (Wed/Fri only)
    addons: "",          // free text for ad-hoc extra lifts
    startedAt: Date.now(),
    completedAt: null
  };
  justCompletedExIdx = null;
  saveState();
  renderToday();
}

function logSet(exIdx, setIdx, weight, reps, rir) {
  const ex = state.current.exercises[exIdx];
  ex.sets[setIdx] = {
    ...ex.sets[setIdx],
    weight: weight,
    reps: reps,
    rir: rir,
    logged: true,
    timestamp: new Date().toISOString()
  };
  saveState();
}

function completeWorkout() {
  if (!state.current) return;
  state.current.completedAt = new Date().toISOString();
  state.workouts.push(state.current);

  const w = state.current;
  state.current = null;
  justCompletedExIdx = null;
  saveState();

  showWorkoutSummary(w);
}

function showWorkoutSummary(w) {
  const totalSets = w.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.logged).length, 0);
  const totalVolume = w.exercises.reduce((sum, ex) =>
    sum + ex.sets.filter(s => s.logged).reduce((s2, set) => s2 + (set.weight * set.reps), 0), 0);
  const durationMin = Math.round((new Date(w.completedAt).getTime() - new Date(w.date).getTime()) / 60000);

  // Detect PRs (any set with higher est 1RM than ever before for that exercise)
  let prs = [];
  w.exercises.forEach(ex => {
    ex.sets.filter(s => s.logged).forEach(set => {
      const e1 = est1RM(set.weight, set.reps);
      const prevBest = previousBest1RM(w.dayKey, effectiveName(ex), w.date);
      if (e1 > prevBest) {
        prs.push({ name: effectiveName(ex), e1, weight: set.weight, reps: set.reps });
      }
    });
  });
  // unique PRs by exercise
  const seen = new Set();
  prs = prs.filter(p => { if (seen.has(p.name)) return false; seen.add(p.name); return true; });

  const cont = document.getElementById("todayContent");
  cont.innerHTML = `
    <div class="card">
      <div class="welcome" style="padding: 20px 0;">
        <div style="font-size: 32px; margin-bottom: 8px;">✓</div>
        <h2 style="color: var(--success);">Workout Complete</h2>
        <p>${w.dayName} · ${fmtDateLong(w.date)}</p>
      </div>
      <div class="summary-stat">
        <span class="label">Duration</span>
        <span class="value">${durationMin} min</span>
      </div>
      <div class="summary-stat">
        <span class="label">Working sets</span>
        <span class="value">${totalSets}</span>
      </div>
      <div class="summary-stat">
        <span class="label">Total volume</span>
        <span class="value">${totalVolume.toLocaleString()} lb</span>
      </div>
      <div class="summary-stat">
        <span class="label">Personal records</span>
        <span class="value ${prs.length ? 'accent-text' : ''}">${prs.length}</span>
      </div>
    </div>

    ${prs.length ? `
      <div class="card">
        <div class="card-title">New PRs</div>
        ${prs.map(p => `
          <div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
            <div style="font-weight: 600; font-size: 15px;">${p.name}</div>
            <div class="small mono" style="margin-top: 2px;">${p.weight} lb × ${p.reps} reps · est 1RM ${p.e1} lb</div>
          </div>
        `).join("")}
      </div>
    ` : ""}

    ${(() => {
      const pcs = workoutPercentiles(w);
      if (!pcs.length) return "";
      return `
        <div class="card">
          <div class="card-title">How You Stack Up</div>
          <div class="small" style="color: var(--text-dim); margin-bottom: 10px;">
            Best est. 1RM today vs. everyone at the gym — all sexes, sizes, and experience levels. Estimated, for fun.
          </div>
          ${pcs.map(p => `
            <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px;">
                <div style="font-weight: 600; font-size: 15px;">${p.name}</div>
                <div class="accent-text" style="font-weight: 700; white-space: nowrap;">${p.label} of all gym-goers</div>
              </div>
              <div class="small mono" style="margin-top: 2px;">
                ${p.stdLabel} basis · est 1RM ${p.e1} lb
              </div>
            </div>
          `).join("")}
        </div>
      `;
    })()}

    <button class="btn" onclick="renderToday()">Back to Today</button>
  `;
}

function previousBest1RM(dayKey, exName, beforeDate) {
  let best = 0;
  state.workouts.forEach(w => {
    if (w.dayKey !== dayKey) return;
    if (new Date(w.date) >= new Date(beforeDate)) return;
    const ex = w.exercises.find(e => effectiveName(e) === exName);
    if (!ex) return;
    ex.sets.filter(s => s.logged).forEach(s => {
      const e1 = est1RM(s.weight, s.reps);
      if (e1 > best) best = e1;
    });
  });
  return best;
}

function discardWorkout() {
  if (!state.current) return;
  if (!confirm("Discard this workout? Logged sets will be lost.")) return;
  state.current = null;
  justCompletedExIdx = null;
  saveState();
  renderToday();
}

// ============================================================================
// REST TIMER
// ============================================================================
let activeView = "today";          // which tab is showing (for day-rollover refresh)
let lastRenderDay = null;          // local date the active view was last rendered

// PWAs stay suspended for days: a view rendered "yesterday" still shows
// yesterday's date, recommended lift, and check-in form. On return, if the
// calendar day changed, re-render the active view fresh.
// ============================================================================
// REST CLOCK — counts UP from the last logged set. Wall-clock based, so the
// elapsed time stays correct while the screen is off (iOS suspends JS, but the
// value is recomputed from Date.now() the moment you look at it again).
// Colour only: no sound, no flashing.
//   > 30s under target ......... red
//   30s to 15s under target .... yellow
//   within 15s of target ....... green
//   15s to 30s over target ..... yellow
//   > 30s over target .......... red
// ============================================================================
let restClock = { startedAt: null, intervalId: null };

function restBandClass(elapsed, target) {
  if (!target) return "rb-idle";
  const diff = elapsed - target;
  if (diff < -30) return "rb-red";
  if (diff < -15) return "rb-yellow";
  if (diff <= 15) return "rb-green";
  if (diff <= 30) return "rb-yellow";
  return "rb-red";
}

function startRestClock() {
  restClock.startedAt = Date.now();
  if (restClock.intervalId) clearInterval(restClock.intervalId);
  restClock.intervalId = setInterval(tickRestClock, 1000);
  tickRestClock();
}

function stopRestClock() {
  if (restClock.intervalId) clearInterval(restClock.intervalId);
  restClock.intervalId = null;
  restClock.startedAt = null;
}

function tickRestClock() {
  const bands = document.querySelectorAll("[data-restband]");
  if (!bands.length) return;
  if (restClock.startedAt == null) {
    bands.forEach(b => {
      b.className = "rest-band rb-idle";
      b.querySelector(".rb-elapsed").textContent = "--:--";
    });
    return;
  }
  const elapsed = Math.floor((Date.now() - restClock.startedAt) / 1000);
  bands.forEach(b => {
    const target = parseInt(b.dataset.restband) || 0;
    b.className = "rest-band " + restBandClass(elapsed, target);
    b.querySelector(".rb-elapsed").textContent = fmtMMSS(elapsed);
  });
  // Keep the clock alive only while a workout is on screen
  if (!state.current && restClock.intervalId) stopRestClock();
}

function onAppForeground() {
  tickRestClock();
  if (todayIsoDate() !== lastRenderDay) {
    if (nutDate === lastRenderDay) nutDate = null;   // was viewing "today" → follow to the new day
    lastRenderDay = todayIsoDate();
    switchView(activeView);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) onAppForeground(); });
window.addEventListener("focus", onAppForeground);
window.addEventListener("pageshow", onAppForeground);

    `;
  }
}

function wireStretchListeners() {
  const toggleAll = document.getElementById("stretchToggleAll");
  if (toggleAll) {
    toggleAll.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const allChecked = STRETCHES.every(s => state.current.stretches[s]);
      if (allChecked) {
        state.current.stretches = {};
      } else {
        STRETCHES.forEach(s => { state.current.stretches[s] = true; });
        vibrate(20);
      }
      saveState();
      // Re-sync the checkboxes + button label without a full re-render
      document.querySelectorAll("[data-stretch]").forEach(label => {
        const name = STRETCHES[parseInt(label.dataset.stretch)];
        const on = !!state.current.stretches[name];
        label.classList.toggle("checked", on);
        const cb = label.querySelector("input"); if (cb) cb.checked = on;
      });
      toggleAll.textContent = allChecked ? "Check all" : "Clear all";
    });
  }
  document.querySelectorAll("[data-stretch]").forEach(label => {
    label.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = parseInt(label.dataset.stretch);
      const name = STRETCHES[idx];
      if (state.current.stretches[name]) {
        delete state.current.stretches[name];
        label.classList.remove("checked");
        label.querySelector("input").checked = false;
      } else {
        state.current.stretches[name] = true;
        label.classList.add("checked");
        label.querySelector("input").checked = true;
        vibrate(20);
      }
      const tgl = document.getElementById("stretchToggleAll");
      if (tgl) tgl.textContent = STRETCHES.every(s => state.current.stretches[s]) ? "Clear all" : "Check all";
      saveState();
    });
  });
}

function wireCoreListeners() {
  document.querySelectorAll("[data-core]").forEach(label => {
    label.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = parseInt(label.dataset.core);
      const name = coreForDay(state.current.dayKey)[idx];
      if (!state.current.core) state.current.core = {};
      if (state.current.core[name]) {
        delete state.current.core[name];
        label.classList.remove("checked");
        label.querySelector("input").checked = false;
      } else {
        state.current.core[name] = true;
        label.classList.add("checked");
        label.querySelector("input").checked = true;
        vibrate(20);
      }
      saveState();
    });
  });
}

function wireAddonsListener() {
  const ta = document.getElementById("addonsBox");
  if (!ta) return;
  ta.addEventListener("input", () => {
    state.current.addons = ta.value;
    saveState();
  });
}

function restTier(restSec) {
  if (!restSec) return null;
  if (restSec >= 150) return "green";   // heavy + upper-moderate compounds (longest rest)
  if (restSec >= 120) return "yellow";  // secondary compounds (mid)
  return "red";                         // isolation (now floored at 90s — shortest rest)
}

  const def = ex.def;
  const dispName = effectiveName(ex);
  const isDone = ex.sets.every(s => s.logged);
  const isOpen = (isCurrent && !isDone) || idx === justCompletedExIdx;
  const suggestion = ex.subTo ? null : suggestNext(state.current.dayKey, def, ex.variant);
  const patternKey = EX_PATTERN[ex.name] || EX_PATTERN[def.name];
  const svg = patternKey ? EX_SVG[patternKey] : "";
  const ytQuery = encodeURIComponent(dispName + " form proper");
  const tier = restTier(def.restSec);
  const vOpts = VARIANTS[ex.name];

  // Previous session for this exercise (for per-set "last time" reference)
  const last = findLastForExercise(state.current.dayKey, dispName, ex.variant);
  const lastSets = last ? last.exercise.sets.filter(s => s.logged) : [];
  const lastDropObj = last && last.exercise.dropSet && last.exercise.dropSet.logged ? last.exercise.dropSet : null;
  const lastDrop = lastDropObj
    ? `${lastDropObj.weight} lb × ${lastDropObj.reps}${lastDropObj.rir != null ? ' @ RIR ' + lastDropObj.rir : ''}`

          <div class="ex-name-wrap">
            ${svg ? `<div class="ex-icon">${svg}</div>` : ""}
            <div class="ex-name">${dispName}${ex.subTo ? ' <span class="sub-chip">SUB</span>' : ''}</div>
          </div>

        </div>

        <div class="variant-row" onclick="event.stopPropagation();">
          <select class="variant-select" data-variant="${idx}">
            ${vOpts.map(v => `<option value="${v}" ${(ex.variant || vOpts[0]) === v ? 'selected' : ''}>${v}</option>`).join("")}
          </select>
        </div>` : ""}
        <div class="ex-meta mono">
          <div class="ex-meta-item">${def.sets} × ${def.repsLow === 0 ? "AMRAP" : def.repsLow + "-" + def.repsHigh}</div>
          <div class="ex-meta-item rest-meta ${tier ? 'rest-' + tier : ''}">${tier ? '● ' : ''}Rest ${def.restSec ? fmtMMSS(def.restSec) : "—"}</div>
          ${def.rirHint ? `<div class="ex-meta-item">${def.rirHint}</div>` : ""}
        </div>
        ${suggestion ? `
          <div class="ex-suggest">
            <span>→</span>
            <span class="mono"><strong>${suggestion.weight} lb × ${suggestion.reps}</strong></span>
            <span style="font-size: 11px; opacity: 0.85;">· ${suggestion.reason}</span>
          </div>
        ` : ""}
        ${def.notes ? `<div class="ex-notes">${def.notes}</div>` : ""}
        <a class="demo-link" href="https://www.youtube.com/results?search_query=${ytQuery}" target="_blank" rel="noopener" onclick="event.stopPropagation();">
          ▷ Watch demo on YouTube
        </a>
      </div>
      <div class="ex-body">
        ${def.restSec ? `
          <div class="rest-band rb-idle" data-restband="${def.restSec}">
            <span class="rb-label">REST</span>
            <span class="rb-elapsed">--:--</span>
            <span class="rb-target">target ${fmtMMSS(def.restSec)}</span>
          </div>
        ` : ""}
        <div class="sets-head">
          <div></div>
          <div>Weight (lb)</div>
          <div>Reps</div>
          <div>RIR</div>
          <div></div>
        </div>
        ${ex.sets.map((set, sIdx) => {
          const prev = lastSets[sIdx];
          const lastTxt = prev
            ? `${prev.weight} lb × ${prev.reps}${prev.rir != null ? ' @ RIR ' + prev.rir : ''}`
            : "N/A";
          const bestAt = bestSetAtPosition(dispName, sIdx, ex.variant);
          const bestTxt = bestAt
            ? `${bestAt.weight} lb × ${bestAt.reps}${bestAt.rir != null ? ' @ RIR ' + bestAt.rir : ''}`
            : "N/A";
          return `
          <div class="set-wrap">

              <input class="set-input" type="number" inputmode="decimal" placeholder="${prev ? prev.weight : (suggestion && sIdx === 0 ? suggestion.weight : '-')}" value="${set.weight ?? ''}" data-prefill="${prev ? prev.weight : (suggestion && sIdx === 0 ? suggestion.weight : '')}" data-field="weight">
              <input class="set-input" type="number" inputmode="numeric" placeholder="${def.repsLow === 0 ? 'AMRAP' : def.repsLow + '-' + def.repsHigh}" value="${set.reps ?? ''}" data-field="reps">

            <select class="rir-select" data-dfield="rir">
              <option value="">RIR</option>
              <option value="0" ${drop.rir === 0 ? 'selected' : ''}>0</option>

              <option value="2" ${drop.rir === 2 ? 'selected' : ''}>2</option>
            </select>
            <button class="log-btn ${dropDone ? 'logged' : ''}" data-drop="${idx}">${dropDone ? '✓' : '+'}</button>
          </div>
          <div class="set-last" style="opacity:.7">${lastDrop ? `Last drop: ${lastDrop}` : 'Tap ✓ to finish — leave blank to skip'}</div>
        </div>

        ${ex.subTo ? `
          <div class="swap-active">⇄ Swapped from <strong>${ex.name}</strong> — <button class="swap-clear-link" data-swapclear="${idx}">undo</button></div>
        ` : `
          <button class="swap-toggle" data-swapbtn="${idx}">⇄ Swap exercise (machine busy, pain, etc.)</button>
          <div class="swap-row" id="swapRow-${idx}" style="display:none;">
            <input type="text" class="bw-input" data-swapinput="${idx}" placeholder="What are you doing instead?">
            <button class="btn btn-sm" data-swapapply="${idx}" style="margin-top:8px;">Apply swap</button>
