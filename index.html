function wireExerciseListeners() {
  // Header toggle
  document.querySelectorAll("[data-toggle]").forEach(h => {
    h.addEventListener("click", () => {
      const exEl = h.closest(".exercise");
      exEl.classList.toggle("open");
    });
  });

  // Log buttons
  document.querySelectorAll("[data-log]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      justCompletedExIdx = null;
      const [exIdx, sIdx] = btn.dataset.log.split("-").map(Number);
      const row = btn.closest(".set-row");
      const wInput = row.querySelector("[data-field='weight']");
      let weight = parseFloat(wInput.value);
      if (isNaN(weight)) {
        // Left blank → use the grayed placeholder (last week's / suggested weight)
        const pf = parseFloat(wInput.dataset.prefill);
        if (!isNaN(pf)) weight = pf;
      }
      const reps = parseInt(row.querySelector("[data-field='reps']").value);
      const rirVal = row.querySelector("[data-field='rir']").value;
      const rir = rirVal === "" ? null : parseInt(rirVal);

      if (!weight || !reps) {
        toast("Enter weight and reps");
        return;
      }

      // Unit-sanity guard: catch machine/implement mix-ups before they poison history
      const exObj = state.current.exercises[exIdx];
      const recentW = recentWeightsFor(exObj, 3);
      if (recentW.length >= 2) {
        const mx = Math.max(...recentW), mn = Math.min(...recentW);
        if (weight > mx * 1.6 || (mn >= 20 && weight < mn * 0.45)) {
          const ok = confirm(`${weight} lb is far outside your recent ${mn}–${mx} lb for ${effectiveName(exObj)}.\n\nDifferent machine or implement? Use the variant selector or Swap so history stays clean.\n\nLog anyway?`);
          if (!ok) return;
        }
      }

      logSet(exIdx, sIdx, weight, reps, rir);
      wInput.value = weight;
      btn.classList.add("logged");
      btn.textContent = "✓";
      row.classList.add("logged");
      vibrate(40);
      startRestClock();

      // Effort warning: failure belongs on the final set, not earlier ones
      if (rir === 0 && sIdx < exObj.sets.length - 1) {
        toast(`⚠ RIR 0 on set ${sIdx + 1} — save failure for the final set`);
      } else {
        toast(`Set ${sIdx + 1} logged · ${weight} × ${reps}`);
      }

      // If this finished the exercise, keep it open (so a drop set can be added) and re-render
      const currentEx = state.current.exercises[exIdx];
      const allDone = currentEx.sets.every(s => s.logged);
      if (allDone) {
        justCompletedExIdx = exIdx;
        setTimeout(() => renderToday(), 500);
      } else {
        refreshProgressBars();
      }
    });
  });

  // Drop set / finisher button — never required. Tapping it finishes the exercise.
  document.querySelectorAll("[data-drop]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const exIdx = parseInt(btn.dataset.drop);
      const row = btn.closest(".drop-row");
      const weight = parseFloat(row.querySelector("[data-dfield='weight']").value);
      const reps = parseInt(row.querySelector("[data-dfield='reps']").value);
      const rirVal = row.querySelector("[data-dfield='rir']").value;
      const rir = rirVal === "" ? null : parseInt(rirVal);

      if (weight && reps) {
        state.current.exercises[exIdx].dropSet = { weight, reps, rir, logged: true, skipped: false };
        startRestClock();
        const dropCount = state.current.exercises.filter(e => e.dropSet && e.dropSet.logged).length;
        if (dropCount >= 3) {
          toast(`⚠ Drop set #${dropCount} today — keep drops to 1–2 lifts`);
        } else {
          toast(`Drop set logged · ${weight} × ${reps}`);
        }
      } else {
        // No data entered — acknowledge as complete (green) without storing numbers
        state.current.exercises[exIdx].dropSet = { weight: null, reps: null, rir: null, logged: false, skipped: true };
        toast("Exercise complete");
      }
      justCompletedExIdx = null;   // collapse this card and advance to the next exercise
      saveState();
      btn.classList.add("logged");
      btn.textContent = "✓";
      row.classList.add("logged");
      vibrate(40);
      setTimeout(() => renderToday(), 350);   // brief green flash, then minimize + open next
    });
  });

  // Notes
  document.querySelectorAll("[data-notes]").forEach(ta => {
    ta.addEventListener("input", (e) => {
      const idx = parseInt(ta.dataset.notes);
      state.current.exercises[idx].notes = ta.value;
      saveState();
    });
  });

  // Variant selector — switching re-renders so Last/Best/suggestion follow the variant
  document.querySelectorAll("[data-variant]").forEach(sel => {
    sel.addEventListener("change", (e) => {
      e.stopPropagation();
      const idx = parseInt(sel.dataset.variant);
      state.current.exercises[idx].variant = sel.value;
      saveState();
      renderToday();
    });
  });

  // Swap exercise flow
  document.querySelectorAll("[data-swapbtn]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const rowEl = document.getElementById("swapRow-" + btn.dataset.swapbtn);
      if (rowEl) rowEl.style.display = rowEl.style.display === "none" ? "block" : "none";
    });
  });
  document.querySelectorAll("[data-swapapply]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.swapapply);
      const inp = document.querySelector(`[data-swapinput="${idx}"]`);
      const val = (inp && inp.value || "").trim();
      if (!val) { toast("Name the exercise you're doing instead"); return; }
      state.current.exercises[idx].subTo = val;
      saveState();
      toast(`Swapped to ${val}`);
      renderToday();
    });
  });
  document.querySelectorAll("[data-swapclear]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.swapclear);
      state.current.exercises[idx].subTo = null;
      saveState();
      renderToday();

}

function refreshProgressBars() {
  const w = state.current;
  if (!w) return;
  let currentIdx = w.exercises.findIndex(ex => !ex.sets.every(s => s.logged));
  if (currentIdx === -1) currentIdx = w.exercises.length - 1;

  document.querySelectorAll(".ex-progress-bar").forEach((bar, i) => {
    const done = w.exercises[i].sets.every(s => s.logged);
    bar.classList.toggle("done", done);
    bar.classList.toggle("current", !done && i === currentIdx);
  });

  // Update exercise state classes
  document.querySelectorAll(".exercise").forEach((el, i) => {
    const done = w.exercises[i].sets.every(s => s.logged);
    el.classList.toggle("done", done);
    el.classList.toggle("current", !done && i === currentIdx);
  });

  // Update done counter
  const doneEx = w.exercises.filter(ex => ex.sets.every(s => s.logged)).length;
  const counter = document.querySelector(".card-tight .small");
  if (counter) counter.textContent = `${doneEx}/${w.exercises.length} exercises complete`;
}

// PDF EXPORT — client-side (jsPDF + autotable). Quick = 1-page highlights,
// Full = every workout, run, and chart. Light theme with vibrant tier accents.

function hexToRgb(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h || "");
  if (!m) return [85, 85, 95];
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Rasterize an SVG string to a PNG data URL at 2x for crisp print.
function svgToPng(svg, w, h) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = w * 2; c.height = h * 2;
      const ctx = c.getContext("2d");
      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

// Render a Chart.js config to a PNG data URL via an offscreen canvas.
async function chartImage(cfg, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.style.cssText = `position:absolute;left:-99999px;width:${w}px;height:${h}px;`;
  document.body.appendChild(c);
  const ch = new Chart(c.getContext("2d"), {
    ...cfg,
    options: {
      ...(cfg.options || {}),
      responsive: false, animation: false, devicePixelRatio: 2,
      plugins: { ...((cfg.options || {}).plugins || {}), legend: { display: false } }
    }
  });
  await new Promise(r => setTimeout(r, 80));
  const url = c.toDataURL("image/png");
  ch.destroy(); c.remove();
  return url;
}

function pdfLineCfg(labels, data, hex, label) {
  const [r, g, b] = hexToRgb(hex);
  return {
    type: "line",
    data: { labels, datasets: [{ label, data, borderColor: hex, backgroundColor: `rgba(${r},${g},${b},0.12)`, borderWidth: 2, tension: 0.3, fill: true, pointRadius: 2, pointBackgroundColor: hex }] },
    options: { scales: { x: { ticks: { color: "#888", font: { size: 9 } }, grid: { color: "#eee" } }, y: { ticks: { color: "#888", font: { size: 9 } }, grid: { color: "#eee" } } } }
  };
}

async function exportPDF(mode) {
  if (!window.jspdf || !window.jspdf.jsPDF) {

  if (!state.workouts.length) { toast("No workouts to export yet"); return; }

    let y = M;

    const dates = state.workouts.map(w => w.date).sort();

      ensure(34);

      doc.text(t, M, y);

      y += 22;
    };

    // ---- Title block ----
    doc.setFillColor(17, 17, 20);

    doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(255, 255, 255);
    doc.text("LIFT LOG", M, 38);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(245, 158, 11);
    doc.text(mode === "full" ? "Full Training Report" : "Training Summary", M, 56);
    doc.setTextColor(180, 180, 185); doc.setFontSize(9);
    doc.text(`${rangeStr}   ·   generated ${fmtDate(new Date().toISOString())}`, M, 68);
    y = 96;

    // ---- Rank bubbles (left) + muscle map (right) ----
    const cards = rankCardsData();
    const bx = M, bw = 288, colW = (bw - 8) / 2, rowH = 42, gap = 6;
    let bi = 0;
    for (const card of cards) {
      const col = bi % 2, row = Math.floor(bi / 2);
      const x = bx + col * (colW + 8), by = y + row * (rowH + gap);
      const hex = bodyTierColor(card.topPct);
      const [r, g, b] = hexToRgb(hex);
      const dark = hex === "#fbbf24";
      doc.setFillColor(r, g, b);
      doc.roundedRect(x, by, colW, rowH, 5, 5, "F");
      doc.setTextColor(dark ? 26 : 255, dark ? 17 : 255, dark ? 0 : 255);
      doc.setFont("helvetica", "bold"); doc.setFontSize(6.5);
      doc.text(card.name.toUpperCase(), x + 8, by + 12);
      doc.setFontSize(15);
      doc.text(card.value != null ? card.value + (card.unit ? " " + card.unit : "") : "—", x + 8, by + 28);
      doc.setFontSize(7.5);
      doc.text(card.pctLabel || "No data yet", x + 8, by + 38);
      bi++;
    }
    const bubblesH = Math.ceil(cards.length / 2) * (rowH + gap);

    // Muscle map image (light theme) on the right
    const mmW = 232, mmH = Math.round(mmW * 250 / 300);
    try {
      const mmSvg = buildBodyMapSVG({ base: "#e5e7eb", stroke: "#cbd5e1", textColor: "#94a3b8", explicitSize: { w: mmW, h: mmH } });
      const mmPng = await svgToPng(mmSvg, mmW, mmH);
      doc.addImage(mmPng, "PNG", M + bw + 12, y + Math.max(0, (bubblesH - mmH) / 2), mmW, mmH);
    } catch (e) { /* muscle map optional */ }

    y += bubblesH + 22;

    // ---- Headline stat boxes ----
    const totalVol = totalVolumeAllTime();
    const totalWorkouts = state.workouts.length;
    let totalSets = 0, totalDrops = 0;
    state.workouts.forEach(w => w.exercises.forEach(ex => {
      totalSets += ex.sets.filter(s => s.logged).length;
      if (ex.dropSet && ex.dropSet.logged) totalDrops++;
    }));
    const totalCheckins = (state.dailyCheckins || []).length;
    const totalRuns = (state.runs || []).length;
    const gWeeks = (state.garminWeeks || []).length;

    const stats = [
      [totalVol.toLocaleString(), "lb lifted"],
      [String(totalWorkouts), "workouts"],
      [String(totalSets + totalDrops), "sets logged"],
      [String(totalCheckins), "check-ins"],
      [String(totalRuns + gWeeks), totalRuns + gWeeks === 1 ? "run logged" : "runs logged"]
    ];
    ensure(64);
    const sw = (CW - 4 * 8) / 5, sh = 56;
    stats.forEach((st, i) => {
      const x = M + i * (sw + 8);
      doc.setFillColor(247, 248, 250); doc.setDrawColor(...LINE); doc.setLineWidth(1);
      doc.roundedRect(x, y, sw, sh, 6, 6, "FD");
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold");
      let fs = 15; if (st[0].length > 8) fs = 11; if (st[0].length > 11) fs = 9;
      doc.setFontSize(fs);
      doc.text(st[0], x + sw / 2, y + 26, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
      doc.text(st[1], x + sw / 2, y + 42, { align: "center" });
    });
    y += sh + 20;

    if (mode === "quick") {
      doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(...MUTED);

    // ================= FULL REPORT =================

        const e1 = est1RM(s.weight, s.reps);
        if (!bestByLift[nm] || e1 > bestByLift[nm].e1) bestByLift[nm] = { e1, weight: s.weight, reps: s.reps, rir: s.rir };
      });
    }));
    const bestRows = Object.entries(bestByLift).sort((a, b) => b[1].e1 - a[1].e1).map(([nm, b]) => {
      const map = STD_MAP[nm];
      const pc = map ? strengthPercentile(b.e1, map.std) : null;
      return [nm, `${b.e1} lb`, `${b.weight}×${b.reps}${b.rir != null ? " @" + b.rir : ""}`, pc ? pc.label : "—"];
    });
    sectionTitle("Personal Bests (est. 1RM)");
    doc.autoTable({
      startY: y, margin: { left: M, right: M },
      head: [["Exercise", "e1RM", "Best Set", "vs gym-goers"]],
      body: bestRows,
      styles: { fontSize: 8, cellPadding: 4, textColor: INK, lineColor: LINE, lineWidth: 0.5 },
      headStyles: { fillColor: [31, 41, 55], textColor: 255, fontSize: 8 },
      alternateRowStyles: { fillColor: [247, 248, 250] }
    });
    y = doc.lastAutoTable.finalY + 20;

    // ---- Training effort ----

    if (effort.length) {
      sectionTitle("Training Effort (recent sessions)");
      doc.autoTable({
        startY: y, margin: { left: M, right: M },
        head: [["Compound", "Avg RIR", "e1RM Trend"]],
        body: effort.map(r => [r.name, r.avgRir != null ? r.avgRir.toFixed(1) : "—", `${r.delta >= 0 ? "+" : ""}${r.delta.toFixed(1)}%${r.grinding ? "  ⚠ grinding" : ""}`]),
        styles: { fontSize: 8, cellPadding: 4, textColor: INK, lineColor: LINE, lineWidth: 0.5 },
        headStyles: { fillColor: [31, 41, 55], textColor: 255, fontSize: 8 },
        alternateRowStyles: { fillColor: [247, 248, 250] }
      });
      y = doc.lastAutoTable.finalY + 20;
    }

    // ---- Recovery & body averages ----
    const ci = state.dailyCheckins || [];
    const avg = (arr) => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : null;
    const hrvA = avg(ci.filter(c => c.hrv != null).map(c => c.hrv));
    const slpA = avg(ci.filter(c => c.sleepScore != null).map(c => c.sleepScore));
    const bbA = avg(ci.filter(c => c.bodyBattery != null).map(c => c.bodyBattery));
    const wSeries = getWeightSeries();
    const vo2s = ci.filter(c => c.vo2 != null).map(c => c.vo2);
    const recRows = [];
    if (hrvA != null) recRows.push(["Avg HRV", `${hrvA.toFixed(0)} ms`]);
    if (slpA != null) recRows.push(["Avg sleep score", slpA.toFixed(0)]);
    if (bbA != null) recRows.push(["Avg body battery", bbA.toFixed(0)]);
    if (vo2s.length) recRows.push(["Latest VO₂ max", `${vo2s[vo2s.length - 1]}`]);
    if (wSeries.length) recRows.push(["Bodyweight", `${wSeries[0].weight} → ${wSeries[wSeries.length - 1].weight} lb (${(wSeries[wSeries.length - 1].weight - wSeries[0].weight >= 0 ? "+" : "")}${(wSeries[wSeries.length - 1].weight - wSeries[0].weight).toFixed(1)})`]);
    const gm = state.garminWeeks || [];
    if (gm.length) recRows.push(["Avg weekly mileage", `${(avg(gm.map(g => g.miles))).toFixed(1)} mi`]);
    recRows.push(["Training phase", (state.phase || "maintenance")]);
    if (recRows.length) {
      sectionTitle("Recovery & Body");
      doc.autoTable({
        startY: y, margin: { left: M, right: M },
        body: recRows,
        styles: { fontSize: 8.5, cellPadding: 4, textColor: INK, lineColor: LINE, lineWidth: 0.5 },
        columnStyles: { 0: { fontStyle: "bold", cellWidth: 160 } }
      });
      y = doc.lastAutoTable.finalY + 20;
    }

    // ---- Charts ----
    const charts = [];
    if (wSeries.length >= 2) charts.push(["Bodyweight (lb)", pdfLineCfg(wSeries.map(b => fmtDate(b.date)), wSeries.map(b => b.weight), "#f59e0b")]);
    const hrvSeries = ci.filter(c => c.hrv != null).sort((a, b) => a.date.localeCompare(b.date));
    if (hrvSeries.length >= 2) charts.push(["HRV (ms)", pdfLineCfg(hrvSeries.map(c => fmtDate(c.date)), hrvSeries.map(c => c.hrv), "#f59e0b")]);
    const vo2Series = ci.filter(c => c.vo2 != null).sort((a, b) => a.date.localeCompare(b.date));
    if (vo2Series.length >= 2) charts.push(["VO₂ Max", pdfLineCfg(vo2Series.map(c => fmtDate(c.date)), vo2Series.map(c => c.vo2), "#06b6d4")]);

    if (charts.length) {

      for (const [label, cfg] of charts) {

        doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...MUTED);
        doc.text(label, M, y); y += 8;
        try {
          const img = await chartImage(cfg, 760, 300);
          const iw = CW, ih = iw * 300 / 760;
          doc.addImage(img, "PNG", M, y, iw, ih);
          y += ih + 16;
        } catch (e) { y += 4; }
      }
    }

    // ---- Full workout log ----
    doc.addPage(); y = M;
    sectionTitle("Complete Workout Log");
    const chrono = [...state.workouts].sort((a, b) => a.date.localeCompare(b.date));
    for (const w of chrono) {
      const vol = w.exercises.reduce((s, e) => s + e.sets.filter(x => x.logged).reduce((s2, x) => s2 + (x.weight * x.reps), 0), 0);

      doc.text(`${vol.toLocaleString()} lb`, PW - M, y, { align: "right" });
      y += 8;

      const body = [];
      w.exercises.forEach(ex => {
        const sets = ex.sets.filter(s => s.logged);
        const nm = effectiveName(ex) + (ex.variant ? ` (${ex.variant})` : "") + (ex.subTo ? " [sub]" : "");
        if (!sets.length && !(ex.dropSet && ex.dropSet.logged)) return;
        sets.forEach((s, i) => body.push([i === 0 ? nm : "", `${s.weight}`, `${s.reps}`, s.rir != null ? `${s.rir}` : "—"]));
        if (ex.dropSet && ex.dropSet.logged) body.push([sets.length ? "" : nm, `${ex.dropSet.weight} (drop)`, `${ex.dropSet.reps}`, ex.dropSet.rir != null ? `${ex.dropSet.rir}` : "—"]);
        if (ex.notes && ex.notes.trim()) body.push([{ content: "↳ " + ex.notes.trim(), colSpan: 4, styles: { fontStyle: "italic", textColor: MUTED, fontSize: 7 } }]);
      });
      if (!body.length) { y += 6; continue; }
      doc.autoTable({
        startY: y, margin: { left: M, right: M },
        head: [["Exercise", "Weight", "Reps", "RIR"]],
        body,
        styles: { fontSize: 7.5, cellPadding: 3, textColor: INK, lineColor: LINE, lineWidth: 0.4 },
        headStyles: { fillColor: [55, 65, 81], textColor: 255, fontSize: 7.5 },
        columnStyles: { 0: { cellWidth: 300 }, 1: { halign: "center" }, 2: { halign: "center" }, 3: { halign: "center" } }
      });
      y = doc.lastAutoTable.finalY + 14;
    }

    // ---- Page numbers ----
    const pages = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED);
      doc.text(`Lift Log · ${p} / ${pages}`, PW - M, PH - 20, { align: "right" });
    }

    doc.save(`LiftLog_Full_${todayIsoDate()}.pdf`);
    toast("Full report saved");
  } catch (e) {
    console.error(e);
    toast("PDF export failed — see console");
  }
}

function renderExerciseDetail(cont) {
  const { dayKey, exerciseName } = historyFocus;

  // Collect all sessions
  const sessions = [];
  state.workouts
    .filter(w => w.dayKey === dayKey)
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .forEach(w => {
      const ex = w.exercises.find(e => e.name === exerciseName);
      if (!ex) return;
      const logged = ex.sets.filter(s => s.logged);
      if (logged.length === 0) return;
      const topSet = logged.reduce((max, s) => s.weight > max.weight ? s : max, logged[0]);
      const volume = logged.reduce((sum, s) => sum + s.weight * s.reps, 0);
      const best1RM = Math.max(...logged.map(s => est1RM(s.weight, s.reps)));
      sessions.push({
        date: w.date,
        topWeight: topSet.weight,
        topReps: topSet.reps,
        volume,

function readinessSignal(c) {
  // Plan thresholds:
  // Body Battery (AM): > 50 green, 30-50 yellow, < 30 red
  // Sleep Score: > 75 green, 60-75 yellow, < 60 red
  // HRV: needs baseline - we'll compare against 14-day average
  if (!c) return { color: "var(--text-muted)", label: "—", desc: "No check-in" };

  let flags = 0;
  let bigFlags = 0;
  let notes = [];

  if (c.bodyBattery != null) {
    if (c.bodyBattery < 30) { bigFlags++; notes.push("body battery low"); }
    else if (c.bodyBattery < 50) { flags++; notes.push("body battery moderate"); }
  }
  if (c.sleepScore != null) {
    if (c.sleepScore < 60) { bigFlags++; notes.push("sleep poor"); }
    else if (c.sleepScore < 75) { flags++; notes.push("sleep okay"); }
  }
  // HRV: compare to 14-day average
  if (c.hrv != null) {
    const recent = state.dailyCheckins
      .filter(x => x.hrv != null && x.date < c.date)
      .sort((a, b) => a.date.localeCompare(b.date))
      .slice(-14);
    if (recent.length >= 5) {
      const avg = recent.reduce((s, x) => s + x.hrv, 0) / recent.length;
      if (c.hrv < avg * 0.85) { bigFlags++; notes.push("HRV well below baseline"); }
      else if (c.hrv < avg * 0.95) { flags++; notes.push("HRV slightly below"); }
    }
  }

  if (bigFlags >= 2 || (bigFlags >= 1 && flags >= 1)) {
    return { color: "var(--danger)", label: "RED", desc: "Rest or deload. " + notes.join("; ") };
  }
  if (bigFlags >= 1 || flags >= 2) {
    return { color: "var(--warn)", label: "YELLOW", desc: "Reduce intensity. " + notes.join("; ") };
  }
  if (flags >= 1) {
    return { color: "var(--warn)", label: "YELLOW", desc: notes.join("; ") };
  }
  return { color: "var(--success)", label: "GREEN", desc: "Cleared to train hard." };
}

function parseIntOrNull(v) {
  const n = parseInt(v);
  return isNaN(n) ? null : n;
}

function parseFloatOrNull(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function drawRunVolumeChart() {
  const canvas = document.getElementById("runVolChart");
  if (!canvas) return;
  if (dailyCharts.runvol) dailyCharts.runvol.destroy();

  const mondayOf = (date) => {
    const dt = new Date(date);
    dt.setHours(0, 0, 0, 0);
    const day = (dt.getDay() + 6) % 7; // Monday = 0
    dt.setDate(dt.getDate() - day);
    return dt;
  };

  const weeks = [];
  const thisMon = mondayOf(new Date());
  for (let i = 9; i >= 0; i--) {
    const m = new Date(thisMon);
    m.setDate(m.getDate() - i * 7);
    weeks.push({ start: m, miles: 0 });
  }
  state.runs.forEach(r => {
    if (!r.distance) return;
    const m = mondayOf(new Date(r.date)).getTime();
    const wk = weeks.find(w => w.start.getTime() === m);
    if (wk) wk.miles += r.distance;
  });
  // Garmin weekly totals override logged-run sums for their week (watch = source of truth)
  (state.garminWeeks || []).forEach(g => {
    const gm = parseLocalDate(g.weekStart).getTime();
    const wk = weeks.find(w => w.start.getTime() === gm);
    if (wk) wk.miles = g.miles;
  });

  const labels = weeks.map(w => `${w.start.getMonth() + 1}/${w.start.getDate()}`);
  const data = weeks.map(w => +w.miles.toFixed(1));
  const color = "#22d3ee";

  dailyCharts.runvol = new Chart(canvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Miles",
        data,
        backgroundColor: color + "cc",
        borderColor: color,
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: "#222", callbacks: { title: (it) => "Week of " + it[0].label, label: (it) => it.parsed.y + " mi" } }
      },
      scales: {
        x: { grid: { color: "#1a1a1a" }, ticks: { color: "#666", font: { size: 10 } } },
        y: { beginAtZero: true, grid: { color: "#1a1a1a" }, ticks: { color: "#666", font: { size: 10 } } }
      }
    }
  });
}

  document.getElementById("runCount").textContent = state.runs.length + " RUNS";

function parseTimeToSec(str) {
  if (!str) return null;
  const parts = str.split(":").map(p => parseInt(p));
  if (parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}
function secsToPace(secPerMi) {
  const m = Math.floor(secPerMi / 60);
  const s = Math.round(secPerMi % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function exportJSON() {

}

function exportCSV() {
  const rows = [["Date", "Day", "Exercise", "Set", "Weight (lb)", "Reps", "RIR", "Volume (lb)", "Est 1RM", "Notes"]];
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.filter(s => s.logged).forEach(s => {
        rows.push([
          localIsoDate(w.date),
          w.dayName,
          ex.name,
          s.idx,
          s.weight,
          s.reps,
          s.rir ?? "",
          s.weight * s.reps,
          est1RM(s.weight, s.reps),
          (ex.notes || "").replace(/"/g, '""')
        ]);
      });
      // Drop set row if logged
      if (ex.dropSet && ex.dropSet.logged) {
        rows.push([
          localIsoDate(w.date),
          w.dayName,
          ex.name,
          "drop",
          ex.dropSet.weight,
          ex.dropSet.reps,
          ex.dropSet.rir ?? "",
          ex.dropSet.weight * ex.dropSet.reps,
          "",
          "drop set"
        ]);
      }
    });
    // Add-on lifts row if present
    if (w.addons && w.addons.trim()) {
      rows.push([
        localIsoDate(w.date),
        w.dayName,
        "[ADD-ONS]",
        "",
        "",
        "",
        "",
        "",
        "",
        w.addons.replace(/"/g, '""')
      ]);
    }
  });
  const csv = rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  downloadBlob(blob, "liftlog-export-" + todayIsoDate() + ".csv");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Exported " + filename);
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm("Replace current data with imported file?")) return;
      state = { ...defaultState(), ...data };
      state.nutrition = normalizeNutrition(state.nutrition);
      saveState();
      toast("Data imported");
      renderData();
      renderToday();
      refreshActiveView();
    } catch (err) {
      toast("Invalid file");
    }
  };
  reader.readAsText(file);
}

// ============================================================================
// NUTRITION — strictly food tracking (bodyweight stays in the Daily check-in).
// Everything lives in state.nutrition, so it rides along in JSON export/import.
//   log:     { "YYYY-MM-DD": { breakfast:[], lunch:[], dinner:[], snacks:[] } }
//   entry:   { id, kind:"food"|"meal", name, serving, qty, cal, p, c, f, s, components? }
//            cal/p/c/f/s are per ONE serving; day totals = value × qty
//   library: [{ id, name, serving, cal, p, c, f, s, source, barcode?, lastUsed }]
//   meals:   [{ id, name, items:[{ foodId, name, serving, qty, cal, p, c, f, s }], lastUsed }]
// The phase (state.phase) is shared with the History effort card.
// ============================================================================
const NUT_SECTIONS = [
  { id: "breakfast", label: "Breakfast" },
  { id: "lunch", label: "Lunch" },
  { id: "dinner", label: "Dinner" },
  { id: "snacks", label: "Snacks" }
];
const NUT_PHASES = [
  { id: "cutting", label: "Cutting", def: 1900 },
  { id: "maintenance", label: "Maintenance", def: 2500 },
  { id: "bulking", label: "Bulking", def: 2900 }
];
const NUT_PROTEIN_DEFAULT = 190;
const NS_TABS = [["library", "Library"], ["meals", "Meals"], ["search", "Search"], ["manual", "Manual"]];
const OFF_BASE = "https://world.openfoodfacts.org";
const OFF_FIELDS = "code,product_name,product_name_en,generic_name,brands,nutriments,serving_size,serving_quantity";
const SCANNER_SRC = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";

// NOTE: called by loadState() before this block's consts exist — keep literal.
function defaultNutrition() {
  return {
    calTargets: { cutting: 1900, maintenance: 2500, bulking: 2900 },
    proteinTarget: 190,
    library: [],
    meals: [],
    log: {}
  };
}
function normalizeNutrition(n) {
  const d = defaultNutrition();
  if (!n || typeof n !== "object") return d;
  return {
    calTargets: { ...d.calTargets, ...(n.calTargets && typeof n.calTargets === "object" ? n.calTargets : {}) },
    proteinTarget: Number(n.proteinTarget) > 0 ? Number(n.proteinTarget) : d.proteinTarget,
    library: Array.isArray(n.library) ? n.library : [],
    meals: Array.isArray(n.meals) ? n.meals : [],
    log: n.log && typeof n.log === "object" ? n.log : {}
  };
}

let nutDate = null;       // ISO date shown on the Nutrition tab (null → today)
let ns = {};              // state of the nutrition sheet
let nutLastTab = null;    // remember the last add-sheet tab between opens

// ---------- small helpers ----------
function nutUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function r1(x) { return Math.round((Number(x) || 0) * 10) / 10; }
function nutFmt(n) { return Math.round(Number(n) || 0).toLocaleString(); }
function nutQty(q) { return String(Math.round((Number(q) || 0) * 100) / 100); }
function blankDay() { return { breakfast: [], lunch: [], dinner: [], snacks: [] }; }
function secLabel(id) { return (NUT_SECTIONS.find(s => s.id === id) || {}).label || ""; }
function currentPhase() { return NUT_PHASES.find(p => p.id === state.phase) || NUT_PHASES[0]; }
function calGoal() {
  const ph = currentPhase();
  return Number(state.nutrition.calTargets[ph.id]) || ph.def;
}
function proteinGoal() { return Number(state.nutrition.proteinTarget) || NUT_PROTEIN_DEFAULT; }
// Soft recommendations (not targets): fat ~27% of calories, carbs fill what
// protein + fat leave, sugar ≤ 10% of calories.
function macroRecs() {
  const cal = calGoal(), pro = proteinGoal();
  const f = Math.round(cal * 0.27 / 9);
  const c = Math.max(0, Math.round((cal - pro * 4 - f * 9) / 4));
  const s = Math.round(cal * 0.10 / 4);
  return { c, f, s };
}
function shiftIso(iso, days) {
  const d = parseLocalDate(iso);
  d.setDate(d.getDate() + days);
  return localIsoDate(d);
}
function nutDay(iso, create) {
  const L = state.nutrition.log;
  if (!L[iso]) {
    if (!create) return null;
    L[iso] = blankDay();
  }
  NUT_SECTIONS.forEach(s => { if (!Array.isArray(L[iso][s.id])) L[iso][s.id] = []; });
  return L[iso];
}
function pruneDay(iso) {
  const d = state.nutrition.log[iso];
  if (d && NUT_SECTIONS.every(s => !(d[s.id] || []).length)) delete state.nutrition.log[iso];
}
function entryTotals(e) {
  const q = Number(e.qty) || 1;
  return { cal: (e.cal || 0) * q, p: (e.p || 0) * q, c: (e.c || 0) * q, f: (e.f || 0) * q, s: (e.s || 0) * q };
}
function sumEntries(list) {
  return (list || []).reduce((t, e) => {
    const x = entryTotals(e);
    t.cal += x.cal; t.p += x.p; t.c += x.c; t.f += x.f; t.s += x.s;
    return t;
  }, { cal: 0, p: 0, c: 0, f: 0, s: 0 });
}
function dayTotals(iso) {
  const d = nutDay(iso, false);
  return d ? sumEntries(NUT_SECTIONS.flatMap(s => d[s.id])) : sumEntries([]);
}
function mealTotals(m) {
  return (m.items || []).reduce((t, i) => {
    const q = Number(i.qty) || 0;
    t.cal += (i.cal || 0) * q; t.p += (i.p || 0) * q; t.c += (i.c || 0) * q; t.f += (i.f || 0) * q; t.s += (i.s || 0) * q;
    return t;
  }, { cal: 0, p: 0, c: 0, f: 0, s: 0 });
}
function macroLine(o) {
  return `${nutFmt(o.cal)} kcal · P ${nutFmt(o.p)} · C ${nutFmt(o.c)} · F ${nutFmt(o.f)} · S ${nutFmt(o.s)}`;
}
function sortedLibrary() {
  return [...state.nutrition.library].sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0) || String(a.name).localeCompare(String(b.name)));
}
// Same name + same serving = same food: update it instead of duplicating.
function upsertLibraryFood(food) {
  const lib = state.nutrition.library;
  const key = String(food.name).trim().toLowerCase();
  const existing = lib.find(x => String(x.name).trim().toLowerCase() === key && (x.serving || "") === (food.serving || ""));
  if (existing) { Object.assign(existing, food, { id: existing.id }); return existing; }
  const nf = { id: nutUid(), ...food };
  lib.push(nf);
  return nf;
}

// ---------- logging ----------
function logEntry(secId, data) {
  const day = nutDay(nutDate, true);
  const e = {
    id: nutUid(),
    kind: data.kind || "food",
    name: String(data.name || "Food"),
    serving: data.serving || "",
    qty: Number(data.qty) > 0 ? Number(data.qty) : 1,
    cal: r1(data.cal), p: r1(data.p), c: r1(data.c), f: r1(data.f), s: r1(data.s)
  };
  if (data.components) e.components = data.components;
  day[secId].push(e);
  saveState();
  renderNutrition();
  updateSheetSub();
  vibrate(20);
  return e;
}
function deleteEntry(secId, id) {
  const day = nutDay(nutDate, false);
  if (!day) return;
  const i = day[secId].findIndex(e => e.id === id);
  if (i < 0) return;
  const [gone] = day[secId].splice(i, 1);
  pruneDay(nutDate);
  saveState();
  renderNutrition();
  vibrate(20);
  toast(`Removed ${gone.name}`);
}
function repeatPrevDay(secId) {
  const prev = nutDay(shiftIso(nutDate, -1), false);
  const items = prev ? prev[secId] : [];
  if (!items.length) return;
  const day = nutDay(nutDate, true);
  items.forEach(e => day[secId].push({ ...JSON.parse(JSON.stringify(e)), id: nutUid() }));
  saveState();
  renderNutrition();
  vibrate(20);
  toast(`Added ${items.length} item${items.length === 1 ? "" : "s"} to ${secLabel(secId)}`);
}

// ---------- main view ----------
function renderNutrition() {
  const cont = document.getElementById("nutritionContent");
  if (!cont) return;
  const today = todayIsoDate();
  if (!nutDate || nutDate > today) nutDate = today;
  const isToday = nutDate === today;
  const dayWord = isToday ? "Today"
    : nutDate === shiftIso(today, -1) ? "Yesterday"
    : parseLocalDate(nutDate).toLocaleDateString("en-US", { weekday: "long" });
  document.getElementById("nutritionDate").textContent = fmtDate(nutDate);

  const t = dayTotals(nutDate);
  const goal = calGoal(), pro = proteinGoal(), rec = macroRecs();
  const ph = currentPhase();
  const day = nutDay(nutDate, false) || blankDay();
  const prev = nutDay(shiftIso(nutDate, -1), false);

  // Calories: within ±5% of goal = green. Over by >5% = red when cutting or
  // maintaining, amber when bulking (overshooting matters less there).
  const calPct = goal ? t.cal / goal : 0;
  let calCls = "";
  if (calPct >= 0.95 && calPct <= 1.05) calCls = "ok";
  else if (calPct > 1.05) calCls = ph.id === "bulking" ? "warn" : "over";
  const calLeft = Math.round(goal - t.cal);
  const proLeft = Math.round(pro - t.p);
  const proCls = t.p >= pro - 5 ? "ok" : "pro";

  const macro = (label, val, recVal, sym) => {
    const pct = recVal ? Math.min(100, val / recVal * 100) : 0;
    const above = recVal && val > recVal * 1.1;
    return `
      <div class="nt-m">
        <div class="lbl">${label}</div>
        <div class="val mono">${nutFmt(val)}<span> g</span></div>
        <div class="mbar"><div style="width:${pct.toFixed(1)}%"></div></div>
        <div class="rec mono ${above ? "above" : ""}">rec ${sym}${nutFmt(recVal)} g</div>
      </div>`;
  };

  cont.innerHTML = `
    <div class="card nut-totals">
      <div class="nut-datebar">
        <button class="nut-dnav" data-act="day-prev" aria-label="Previous day">‹</button>
        <button class="nut-dlabel" data-act="day-today" ${isToday ? "disabled" : ""} aria-label="Jump to today">
          <span class="nut-dword">${dayWord}</span>
          <span class="nut-dfull mono">${fmtDateLong(nutDate)}</span>
        </button>
        <button class="nut-dnav" data-act="day-next" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>
      </div>

      <div class="nt-row">
        <div class="nt-label">Calories</div>
        <div class="nt-num mono"><b>${nutFmt(t.cal)}</b> / <button class="nt-goal" data-act="edit-cal" aria-label="Edit calorie goal">${nutFmt(goal)}</button> kcal</div>
      </div>
      <div class="nt-bar"><div class="nt-fill ${calCls}" style="width:${Math.min(100, calPct * 100).toFixed(1)}%"></div></div>
      <div class="nt-sub">${calLeft >= 0 ? nutFmt(calLeft) + " kcal left" : nutFmt(-calLeft) + " kcal over"} · ${ph.label}</div>

      <div class="nt-row">
        <div class="nt-label">Protein</div>
        <div class="nt-num mono"><b>${nutFmt(t.p)}</b> / <button class="nt-goal" data-act="edit-pro" aria-label="Edit protein goal">${nutFmt(pro)}</button> g</div>
      </div>
      <div class="nt-bar"><div class="nt-fill ${proCls}" style="width:${Math.min(100, pro ? t.p / pro * 100 : 0).toFixed(1)}%"></div></div>
      <div class="nt-sub">${proLeft > 0 ? proLeft + " g to go" : "Protein target hit ✓"}</div>

      <div class="nt-macros">
        ${macro("Carbs", t.c, rec.c, "~")}
        ${macro("Fat", t.f, rec.f, "~")}
        ${macro("Sugar", t.s, rec.s, "≤")}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Phase</div>
      <div class="phase-row">
        ${NUT_PHASES.map(p => `
          <button class="phase-btn ${p.id === ph.id ? "active" : ""}" data-act="phase" data-ph="${p.id}">${p.label}<span class="phase-kcal">${nutFmt(state.nutrition.calTargets[p.id] || p.def)}</span></button>
        `).join("")}
      </div>
      <div class="small" style="margin-top: 8px; color: var(--text-dim);">Sets your calorie target and the cut/bulk read on the History effort card. Tap a goal number above to edit it.</div>
    </div>

    ${NUT_SECTIONS.map(sec => nutSectionHtml(sec, day[sec.id], prev, isToday)).join("")}
  `;
}

function nutSectionHtml(sec, items, prev, isToday) {
  const st = sumEntries(items);
  const prevItems = sec.id !== "snacks" && prev ? prev[sec.id] : [];
  return `
    <div class="card nut-sec">
      <div class="nut-sec-head">
        <div style="min-width: 0;">
          <div class="card-title" style="margin: 0;">${sec.label}</div>
          <div class="small mono" style="margin-top: 3px;">${items.length ? `${nutFmt(st.cal)} kcal · ${nutFmt(st.p)} g protein` : "Nothing logged"}</div>
        </div>
        <button class="btn btn-xs nut-add" data-act="open-add" data-sec="${sec.id}">+ Add</button>
      </div>
      ${items.length ? `<div class="nut-items">${items.map(e => nutItemHtml(e, sec.id)).join("")}</div>` : ""}
      ${prevItems && prevItems.length ? `
        <button class="nut-repeat" data-act="repeat" data-sec="${sec.id}">↻ Add ${isToday ? "yesterday" : "previous day"}'s ${sec.label.toLowerCase()} <span class="mono">· ${nutFmt(sumEntries(prevItems).cal)} kcal</span></button>
      ` : ""}
    </div>`;
}

function nutItemHtml(e, secId) {
  const x = entryTotals(e);
  const q = Number(e.qty) || 1;
  const bits = [];
  if (e.serving) bits.push(q !== 1 ? `${nutQty(q)} × ${e.serving}` : e.serving);
  else if (q !== 1) bits.push(`${nutQty(q)} ×`);
  if (e.kind === "meal") bits.push(`${(e.components || []).length} items`);
  return `
    <div class="swipe-row" data-entry="${e.id}" data-sec="${secId}">
      <button class="swipe-del" data-act="del" data-entry="${e.id}" data-sec="${secId}">Delete</button>
      <div class="swipe-fg" data-act="edit-entry" data-entry="${e.id}" data-sec="${secId}">
        <div class="ni-main">
          <div class="ni-name">${e.kind === "meal" ? '<span class="ni-meal">MEAL</span> ' : ""}${esc(e.name)}</div>
          <div class="ni-sub mono">${bits.length ? esc(bits.join(" · ")) + " · " : ""}P ${nutFmt(x.p)} · C ${nutFmt(x.c)} · F ${nutFmt(x.f)} · S ${nutFmt(x.s)}</div>
        </div>
        <div class="ni-kcal mono">${nutFmt(x.cal)}</div>
        <button class="item-x" data-act="del" data-entry="${e.id}" data-sec="${secId}" aria-label="Delete ${esc(e.name)}">✕</button>
      </div>
    </div>`;
}

// ---------- main view: clicks + swipe-to-delete ----------
function onNutritionClick(ev) {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, sec = el.dataset.sec, id = el.dataset.entry;
  if (act === "edit-entry") {
    const row = el.closest(".swipe-row");
    if (row && (row.dataset.justSwiped || row.classList.contains("open"))) { row.classList.remove("open"); return; }
    openEntrySheet(sec, id);
    return;
  }
  if (act === "day-prev") { nutDate = shiftIso(nutDate, -1); renderNutrition(); }
  else if (act === "day-next") { if (nutDate < todayIsoDate()) { nutDate = shiftIso(nutDate, 1); renderNutrition(); } }
  else if (act === "day-today") { nutDate = todayIsoDate(); renderNutrition(); }
  else if (act === "phase") {
    state.phase = el.dataset.ph;
    saveState();
    renderNutrition();
    toast(`${currentPhase().label} · ${nutFmt(calGoal())} kcal`);
  }
  else if (act === "edit-cal") openGoalSheet("cal");
  else if (act === "edit-pro") openGoalSheet("pro");
  else if (act === "open-add") openAddSheet(sec);
  else if (act === "repeat") repeatPrevDay(sec);
  else if (act === "del") deleteEntry(sec, id);
}

let nutSwipe = null;
const SWIPE_OPEN = 84;
function closeOpenSwipes(except) {
  document.querySelectorAll("#nutritionContent .swipe-row.open").forEach(r => { if (r !== except) r.classList.remove("open"); });
}
function onNutTouchStart(ev) {
  const row = ev.target.closest(".swipe-row");
  closeOpenSwipes(row);
  if (!row || ev.target.closest(".swipe-del")) { nutSwipe = null; return; }
  const t = ev.touches[0];
  nutSwipe = { row, fg: row.querySelector(".swipe-fg"), x0: t.clientX, y0: t.clientY, dx: 0, dir: null, base: row.classList.contains("open") ? -SWIPE_OPEN : 0 };
}
function onNutTouchMove(ev) {
  const s = nutSwipe;
  if (!s) return;
  const t = ev.touches[0];
  const dx = t.clientX - s.x0, dy = t.clientY - s.y0;
  if (!s.dir) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    s.dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  }
  if (s.dir !== "h") return;
  if (ev.cancelable) ev.preventDefault();
  s.dx = dx;
  const x = Math.max(-SWIPE_OPEN - 30, Math.min(0, s.base + dx));
  s.fg.style.transition = "none";
  s.fg.style.transform = `translateX(${x}px)`;
}
function onNutTouchEnd() {
  const s = nutSwipe;
  nutSwipe = null;
  if (!s || s.dir !== "h") return;
  s.fg.style.transition = "";
  s.fg.style.transform = "";
  s.row.classList.toggle("open", s.base + s.dx < -SWIPE_OPEN / 2);
  s.row.dataset.justSwiped = "1";
  setTimeout(() => { delete s.row.dataset.justSwiped; }, 350);
}

  document.getElementById("nutSheetTitle").textContent = title;

  body.scrollTop = 0;
}
function sectionSummary(secId) {
  const d = nutDay(nutDate, false);
  const items = d ? d[secId] : [];
  return items.length ? `${items.length} item${items.length === 1 ? "" : "s"} · ${nutFmt(sumEntries(items).cal)} kcal so far` : "Nothing logged yet";
}
function updateSheetSub() {
  if (ns.mode === "add") document.getElementById("nutSheetSub").textContent = `${fmtDate(nutDate)} · ${sectionSummary(ns.section)}`;
}
function closeNutSheet() {

}
function flashPlus(btn) {
  if (!btn) return;

  setTimeout(() => { btn.classList.remove("added"); btn.textContent = "+"; }, 700);
}

function openAddSheet(secId) {
  const hasLib = state.nutrition.library.length > 0;
  ns = { mode: "add", section: secId, view: "tabs", tab: nutLastTab || (hasLib ? "library" : "search"), results: null, query: "", barcode: "" };

}
function renderAddSheet() {
  if (nutScanner) stopScanner();

}

function libraryPane() {
  const lib = sortedLibrary();

// ---------- meal builder ----------
function openMealBuilder(mealId) {
  const m = mealId ? state.nutrition.meals.find(x => x.id === mealId) : null;
  const qty = {}, orphans = [];
  if (m) m.items.forEach(it => {
    if (it.foodId && state.nutrition.library.some(f => f.id === it.foodId)) qty[it.foodId] = (qty[it.foodId] || 0) + (Number(it.qty) || 0);
    else orphans.push({ ...it, _oid: nutUid() });
  });
  ns.draft = { id: m ? m.id : null, name: m ? m.name : "", qty, orphans };
  ns.view = "meal-builder";
  renderAddSheet();
}
function draftItems() {
  const d = ns.draft, items = [];
  state.nutrition.library.forEach(f => {
    const q = d.qty[f.id];
    if (q > 0) items.push({ foodId: f.id, name: f.name, serving: f.serving || "", qty: q, cal: f.cal, p: f.p, c: f.c, f: f.f, s: f.s });
  });
  d.orphans.forEach(o => {

function mbStep(key, dir) {
  const d = ns.draft;
  const bump = q => dir > 0 ? (q === 0 ? 1 : q + 0.5) : Math.max(0, q - 0.5);

    d.qty[id] = q;

  }
  const span = document.querySelector(`#nutSheetBody [data-qty="${key}"]`);

// ---------- Open Food Facts ----------
async function offFetchJson(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (r.status === 404) return { status: 0 };      // unknown barcode
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}
// OFF reports nutrients per 100 g. Fall back to kJ when kcal is missing.
function offNormalize(p) {
  if (!p) return null;
  const n = p.nutriments || {};
  const num = k => { const v = parseFloat(n[k]); return isFinite(v) ? v : null; };
  let kcal = num("energy-kcal_100g");
  if (kcal == null) {
    const kj = num("energy-kj_100g") != null ? num("energy-kj_100g") : num("energy_100g");
    if (kj != null) kcal = kj / 4.184;
  }
  const name = String(p.product_name || p.product_name_en || p.generic_name || "").trim();
  if (kcal == null || !name) return null;
  let sg = parseFloat(p.serving_quantity);
  if (!(sg > 0)) {
    const m = String(p.serving_size || "").match(/([\d.]+)\s*(g|ml)\b/i);
    sg = m ? parseFloat(m[1]) : null;
  }
  return {
    code: String(p.code || ""),
    name,
    brand: String(p.brands || "").split(",")[0].trim(),
    servingG: sg > 0 ? r1(sg) : null,
    per100: { cal: kcal, p: num("proteins_100g") || 0, c: num("carbohydrates_100g") || 0, f: num("fat_100g") || 0, s: num("sugars_100g") || 0 }
  };
}
function offErrorMsg(e) {
  return e && e.name === "AbortError"
    ? "Open Food Facts took too long to answer. Try again in a moment, or add it under Manual."
    : "Couldn't reach Open Food Facts. Check your connection, or add it under Manual.";
}
async function nutSearch() {
  const q = String(ns.query || "").trim();
  if (q.length < 2) { toast("Type at least 2 letters"); return; }
  if (document.activeElement) document.activeElement.blur();
  stopScanner();
  const token = ns.reqToken = nutUid();
  ns.status = "loading"; ns.statusMsg = "Searching Open Food Facts…"; ns.results = null;
  setResults();
  try {
    const j = await offFetchJson(`${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`);
    if (ns.reqToken !== token) return;
    ns.results = (j.products || []).map(offNormalize).filter(Boolean);
    ns.status = null;
  } catch (e) {
    if (ns.reqToken !== token) return;
    ns.status = "error"; ns.statusMsg = offErrorMsg(e);
  }
  setResults();
}
async function lookupBarcode(raw) {
  const code = String(raw || "").replace(/\D/g, "");
  if (code.length < 6 || code.length > 14) { toast("Barcodes are 6–14 digits"); return; }
  if (document.activeElement) document.activeElement.blur();
  ns.barcode = code;
  const token = ns.reqToken = nutUid();
  ns.status = "loading"; ns.statusMsg = `Looking up ${code}…`;
  setResults();
  try {
    const j = await offFetchJson(`${OFF_BASE}/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    if (ns.reqToken !== token) return;
    if (!j || !j.product) {
      ns.status = "error"; ns.statusMsg = `Barcode ${code} isn't in Open Food Facts yet. Try a name search, or add it under Manual.`;
    } else {
      const p = offNormalize({ code, ...j.product });
      if (!p) {
        ns.status = "error"; ns.statusMsg = "Found it, but Open Food Facts has no calorie data for this product. Add it under Manual.";
      } else {
        ns.status = null;
        openPortion(p);
        return;
      }
    }
  } catch (e) {
    if (ns.reqToken !== token) return;
    ns.status = "error"; ns.statusMsg = offErrorMsg(e);
  }
  setResults();
}

// ---------- camera barcode scanning (html5-qrcode, loaded on first use) ----------
let nutScanner = null, nutScanBusy = false, scannerLibPromise = null;
function loadScannerLib() {
  if (window.__Html5QrcodeLibrary__) return Promise.resolve(window.__Html5QrcodeLibrary__);
  if (!scannerLibPromise) {
    scannerLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = SCANNER_SRC;
      s.async = true;
      s.onload = () => window.__Html5QrcodeLibrary__ ? resolve(window.__Html5QrcodeLibrary__) : reject(new Error("load"));
      s.onerror = () => { scannerLibPromise = null; s.remove(); reject(new Error("load")); };
      document.head.appendChild(s);
    });
  }
  return scannerLibPromise;
}
async function startScanner() {
  if (nutScanner || nutScanBusy) return;
  const wrap = document.getElementById("nutScanWrap");
  if (!wrap) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("No camera access here — type the digits instead");
    return;
  }
  nutScanBusy = true;
  wrap.style.display = "block";
  try {
    const lib = await loadScannerLib();
    if (!document.getElementById("nutScanner")) return;     // sheet changed while loading
    const F = lib.Html5QrcodeSupportedFormats;
    const sc = new lib.Html5Qrcode("nutScanner", {
      verbose: false,
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128],
      useBarCodeDetectorIfSupported: true
    });
    nutScanner = sc;
    let done = false;
    await sc.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: (w, h) => ({ width: Math.max(120, Math.floor(Math.min(w * 0.88, 340))), height: Math.max(60, Math.floor(Math.min(h * 0.45, 150))) }) },
      async (text) => {
        if (done) return;
        done = true;
        vibrate(30);
        await stopScanner();
        const code = String(text).replace(/\D/g, "");
        const inp = document.querySelector('#nutSheetBody [data-sinput="barcode"]');
        if (inp) inp.value = code;
        lookupBarcode(code);
      },
      () => {}
    );
  } catch (e) {
    await stopScanner();
    toast(e && e.message === "load" ? "Scanner didn't load — type the digits instead" : "Couldn't start the camera — check camera permission, or type the digits");
  } finally {
    nutScanBusy = false;
  }
}
async function stopScanner() {
  const sc = nutScanner;
  nutScanner = null;
  const wrap = document.getElementById("nutScanWrap");
  if (wrap) wrap.style.display = "none";
  if (!sc) return;
  try { if (sc.isScanning) await sc.stop(); } catch (e) { /* already stopped */ }
  try { sc.clear(); } catch (e) { /* element gone */ }
}

// ---------- sheet: clicks ----------
function readNum(id) {
  const el = document.getElementById(id);
  if (!el || el.value.trim() === "") return null;
  const v = parseFloat(el.value);
  return isFinite(v) && v >= 0 ? v : NaN;
}
function onNutSheetClick(ev) {
  const el = ev.target.closest("[data-sact]");
  if (!el) return;
  const a = el.dataset.sact;
  const lib = state.nutrition.library;

  if (a === "tab") { ns.tab = el.dataset.tab; nutLastTab = ns.tab; ns.view = "tabs"; renderAddSheet(); }
  else if (a === "back") {
    ns.view = "tabs";
    if (ns.product) ns.tab = "search";
    renderAddSheet();
  }
  else if (a === "add-food") {
    const f = lib.find(x => x.id === el.dataset.id);
    if (!f) return;
    f.lastUsed = Date.now();
    logEntry(ns.section, { kind: "food", name: f.name, serving: f.serving, cal: f.cal, p: f.p, c: f.c, f: f.f, s: f.s });
    flashPlus(el);
    toast(`Added ${f.name}`);
  }
  else if (a === "edit-food") { ns.editId = el.dataset.id; ns.view = "food-edit"; renderAddSheet(); }
  else if (a === "save-food") {
    const f = lib.find(x => x.id === ns.editId);
    if (!f) return;
    const name = document.getElementById("efName").value.trim();
    const vals = ["efCal", "efP", "efC", "efF", "efS"].map(readNum);
    if (!name) { toast("Name the food"); return; }
    if (vals.some(v => Number.isNaN(v)) || vals[0] == null) { toast("Enter calories (no negatives)"); return; }
    Object.assign(f, { name, serving: document.getElementById("efServ").value.trim(), cal: r1(vals[0]), p: r1(vals[1]), c: r1(vals[2]), f: r1(vals[3]), s: r1(vals[4]) });
    saveState();
    toast(`Saved ${name}`);
    ns.view = "tabs"; ns.tab = "library";
    renderAddSheet();
  }
  else if (a === "del-food") {
    const f = lib.find(x => x.id === ns.editId);
    if (!f || !confirm(`Delete "${f.name}" from your library?\n\nLogged days and saved meals keep their own copy.`)) return;
    state.nutrition.library = lib.filter(x => x.id !== f.id);
    saveState();
    toast(`Deleted ${f.name}`);
    ns.view = "tabs"; ns.tab = "library";
    renderAddSheet();
  }
  else if (a === "new-meal") openMealBuilder(null);
  else if (a === "edit-meal") openMealBuilder(el.dataset.id);
  else if (a === "mb-inc") mbStep(el.dataset.key, 1);
  else if (a === "mb-dec") mbStep(el.dataset.key, -1);
  else if (a === "save-meal") {
    const d = ns.draft, name = String(d.name || "").trim(), items = draftItems();
    if (!name) { toast("Name the meal first"); return; }
    if (!items.length) { toast("Add at least one food"); return; }
    const existing = d.id ? state.nutrition.meals.find(m => m.id === d.id) : null;
    if (existing) { existing.name = name; existing.items = items; }
    else state.nutrition.meals.push({ id: nutUid(), name, items, lastUsed: Date.now() });
    saveState();
    toast(`Saved "${name}"`);
    ns.view = "tabs"; ns.tab = "meals"; nutLastTab = "meals";
    renderAddSheet();
  }
  else if (a === "del-meal") {
    const m = state.nutrition.meals.find(x => x.id === ns.draft.id);
    if (!m || !confirm(`Delete the meal "${m.name}"?\n\nDays you've already logged keep it.`)) return;
    state.nutrition.meals = state.nutrition.meals.filter(x => x.id !== m.id);
    saveState();
    toast(`Deleted ${m.name}`);
    ns.view = "tabs"; ns.tab = "meals";
    renderAddSheet();
  }
  else if (a === "add-meal") {
    const m = state.nutrition.meals.find(x => x.id === el.dataset.id);
    if (!m) return;
    m.lastUsed = Date.now();
    logEntry(ns.section, { kind: "meal", name: m.name, serving: "", ...mealTotals(m), components: m.items.map(i => ({ name: i.name, qty: i.qty, serving: i.serving })) });
    flashPlus(el);
    toast(`Added ${m.name}`);
  }
  else if (a === "search") nutSearch();
  else if (a === "lookup") lookupBarcode(ns.barcode);
  else if (a === "scan") startScanner();
  else if (a === "scan-stop") stopScanner();
  else if (a === "pick") { const p = (ns.results || [])[Number(el.dataset.i)]; if (p) openPortion(p); }
  else if (a === "grams") {
    ns.grams = Number(el.dataset.g);
    const inp = document.querySelector('#nutSheetBody [data-sinput="grams"]');
    if (inp) inp.value = ns.grams;
    document.getElementById("pvMacros").innerHTML = macroGridHtml(portionCalc());
  }
  else if (a === "add-product") {
    const g = Number(ns.grams);
    if (!(g > 0)) { toast("Enter a portion in grams"); return; }
    const p = ns.product, v = portionCalc();
    const name = p.brand && !p.name.toLowerCase().includes(p.brand.toLowerCase()) ? `${p.name} (${p.brand})` : p.name;
    const serving = `${r1(g)} g`;
    if (document.getElementById("pvSave").checked) {
      const lf = upsertLibraryFood({ name, serving, cal: r1(v.cal), p: r1(v.p), c: r1(v.c), f: r1(v.f), s: r1(v.s), source: "off", barcode: p.code || "" });
      lf.lastUsed = Date.now();
    }
    logEntry(ns.section, { kind: "food", name, serving, ...v });
    toast(`Added ${name}`);
    ns.view = "tabs"; ns.tab = "search"; ns.product = null;
    renderAddSheet();
  }
  else if (a === "add-manual") {
    const name = document.getElementById("mfName").value.trim();
    const vals = ["mfCal", "mfP", "mfC", "mfF", "mfS"].map(readNum);
    if (!name) { toast("Name the food"); return; }
    if (vals[0] == null) { toast("Enter calories"); return; }
    if (vals.some(v => Number.isNaN(v))) { toast("Numbers only — no negatives"); return; }
    const food = { name, serving: document.getElementById("mfServ").value.trim(), cal: r1(vals[0]), p: r1(vals[1]), c: r1(vals[2]), f: r1(vals[3]), s: r1(vals[4]), source: "manual" };
    const lf = upsertLibraryFood(food);
    lf.lastUsed = Date.now();
    logEntry(ns.section, { kind: "food", ...food });
    toast(`Added ${name} · saved to library`);
    ["mfName", "mfServ", "mfCal", "mfP", "mfC", "mfF", "mfS"].forEach(id => { document.getElementById(id).value = ""; });
  }
  else if (a === "q-inc") setEntryQty((Number(ns.qty) || 0) + 0.5);
  else if (a === "q-dec") setEntryQty(Math.max(0.25, (Number(ns.qty) || 0) - 0.5));
  else if (a === "entry-save") {
    const e = currentEntry();
    if (!e) { closeNutSheet(); return; }
    if (!(ns.qty > 0)) { toast("Servings must be above 0 — or tap Delete"); return; }
    e.qty = ns.qty;
    saveState();
    closeNutSheet();
    renderNutrition();
    toast("Entry updated");
  }
  else if (a === "entry-del") {
    const sec = ns.section, id = ns.entryId;
    closeNutSheet();
    deleteEntry(sec, id);
  }
  else if (a === "goal-reset") saveGoal(ns.kind === "cal" ? currentPhase().def : NUT_PROTEIN_DEFAULT);
  else if (a === "goal-save") saveGoal(document.getElementById("goalVal").value);

}
function onNutSheetKey(ev) {

// Wire once — both containers are re-rendered via innerHTML, so delegate.
(function initNutrition() {
  const cont = document.getElementById("nutritionContent");
  cont.addEventListener("click", onNutritionClick);
  cont.addEventListener("touchstart", onNutTouchStart, { passive: true });
  cont.addEventListener("touchmove", onNutTouchMove, { passive: false });
  cont.addEventListener("touchend", onNutTouchEnd);
  cont.addEventListener("touchcancel", onNutTouchEnd);
  const body = document.getElementById("nutSheetBody");
  body.addEventListener("click", onNutSheetClick);
  body.addEventListener("input", onNutSheetInput);
  body.addEventListener("keydown", onNutSheetKey);
})();

  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === view));

  if (view === "today") renderToday();
  if (view === "history") { historyFocus = null; renderHistory(); }
  if (view === "daily") renderDaily();
  if (view === "run") renderRun();
  if (view === "nutrition") renderNutrition();

  window.scrollTo(0, 0);
}

// Re-render the visible tab in place (no scroll reset) after data changes made
// from the ⋮ panel, which can now be opened on top of any tab.
function refreshActiveView() {
  if (activeView === "today") renderToday();
  else if (activeView === "history") renderHistory();
  else if (activeView === "daily") renderDaily();
  else if (activeView === "run") renderRun();
  else if (activeView === "nutrition") renderNutrition();
}

// ============================================================================
// SHEETS — shared overlay used by the ⋮ Settings & Data panel and Nutrition.
// Bottom sheet on phones, centred modal on wider screens.
// ============================================================================
function openOverlay(el) {
  el.classList.add("show");
  el.setAttribute("aria-hidden", "false");
  document.body.classList.add("sheet-open");
}
function closeOverlay(el) {
  if (!el) return;
  el.classList.remove("show");
  el.setAttribute("aria-hidden", "true");
  if (!document.querySelector(".sheet-overlay.show")) document.body.classList.remove("sheet-open");
}
function closeAnyOverlay(el) {
  if (el && el.id === "nutSheet") closeNutSheet();
  else closeOverlay(el);
}
function openSettings() {
  renderData();
  openOverlay(document.getElementById("settingsPanel"));
}

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-settings]")) { openSettings(); return; }
  const closeBtn = e.target.closest("[data-close-sheet]");
  if (closeBtn) { closeAnyOverlay(closeBtn.closest(".sheet-overlay")); return; }
  // Tap on the dimmed backdrop (not the sheet itself) closes it
  if (e.target.classList && e.target.classList.contains("sheet-overlay")) closeAnyOverlay(e.target);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = [...document.querySelectorAll(".sheet-overlay.show")].pop();
  if (open) closeAnyOverlay(open);
});

document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => switchView(item.dataset.view));
});

// ============================================================================
// INIT
// ============================================================================
window.discardWorkout = discardWorkout;
window.completeWorkout = completeWorkout;
window.startWorkout = startWorkout;
window.renderToday = renderToday;
window.renderHistory = renderHistory;

lastRenderDay = todayIsoDate();
// Ask the browser to protect localStorage from eviction (iOS can purge
// storage for sites unused ~7 days; this request makes that much less likely).
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

renderToday();

// Prevent zoom on iOS double-tap
let lastTouch = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
</body>
